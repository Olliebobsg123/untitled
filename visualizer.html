// ============================================================
// WEBSOCKET
// ============================================================

function connect(){

  clearTimeout(
    reconnect
  );


  try{

    ws =
      new WebSocket(
        "ws://localhost:8081"
      );


    ws.binaryType =
      "arraybuffer";


    ws.onopen = ()=>{

      statusText(
        "🟢 ART-NET CONNECTED<br>" +
        "Fixtures: " +
        S.objects.length +
        "<br>" +
        "Waiting for DMX..."
      );


      requestRender();

    };


    ws.onmessage =
      e => artnet(e.data);


    ws.onerror = ()=>{

      statusText(
        "🟠 ART-NET CONNECTION ERROR"
      );

    };


    ws.onclose = ()=>{

      statusText(
        "🔴 ART-NET DISCONNECTED"
      );


      reconnect =
        setTimeout(
          connect,
          2000
        );

    };


  }catch{

    reconnect =
      setTimeout(
        connect,
        2000
      );

  }

}


// ============================================================
// INITIALIZE
// ============================================================

function init(){

  S.scene =
    new THREE.Scene();


  S.scene.background =
    new THREE.Color(
      0x080808
    );


  S.scene.fog =
    new THREE.Fog(
      0x080808,
      50,
      110
    );


  S.camera =
    new THREE.PerspectiveCamera(
      55,
      innerWidth/innerHeight,
      .1,
      120
    );


  S.camera.position.set(
    20,
    12,
    26
  );


  // Haze/dust-mote/floor-spot meshes live on layer 1 (see makeFixture) so
  // the beam-shadow depth cameras (updateBeamShadows, layer 0 only by
  // default) can render just the solid occluders without these additive
  // effects self-occluding. The main view camera needs both layers.
  S.camera.layers.enable(1);


  // ==========================================================
  // RENDERER
  // ==========================================================

  S.renderer =
    new THREE.WebGLRenderer({

      antialias:true,

      powerPreference:
        "high-performance"

    });


  S.renderer.setSize(
    innerWidth,
    innerHeight,
    false
  );


  S.renderer.setPixelRatio(
    Math.min(
      window.devicePixelRatio,
      MAX_PIXEL_RATIO
    )
  );


  S.renderer.outputColorSpace =
    THREE.SRGBColorSpace;


  S.renderer.toneMapping =
    THREE.ACESFilmicToneMapping;


  S.renderer.toneMappingExposure =
    BASE_TONE_EXPOSURE;


  S.renderer.shadowMap.enabled = true;


  S.renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;


  $("viz").appendChild(
    S.renderer.domElement
  );


  // ==========================================================
  // ENVIRONMENT LIGHTING (fixtures only)
  // ==========================================================
  //
  // Gives fixture bodies/heads something to reflect so they read
  // as real metal/plastic instead of flat grey. Deliberately
  // assigned only to the fixture materials below (NOT
  // scene.environment) so the existing theatre set isn't
  // relit by it.

  const pmrem =
    new THREE.PMREMGenerator(S.renderer);

  S.envMap =
    pmrem.fromScene(
      new RoomEnvironment(),
      .04
    ).texture;

  pmrem.dispose();


  // ==========================================================
  // SHARED FIXTURE RESOURCES
  // ==========================================================

  createSharedFixtureResources();


  // ==========================================================
  // POST-PROCESSING (bloom)
  // ==========================================================

  S.composer =
    new EffectComposer(S.renderer);

  S.composer.addPass(
    new RenderPass(S.scene,S.camera)
  );

  S.bloomPass =
    new UnrealBloomPass(
      new THREE.Vector2(innerWidth,innerHeight),
      .4,
      .2,
      .85
    );

  S.composer.addPass(S.bloomPass);

  S.composer.addPass(new OutputPass());


  // ==========================================================
  // ORBIT CONTROLS
  // ==========================================================

  S.controls =
    new OrbitControls(
      S.camera,
      S.renderer.domElement
    );


  S.controls.enableDamping = true;

  S.controls.dampingFactor = .06;

  S.controls.target.set(
    0,
    4,
    -6
  );


  S.controls.maxDistance = 65;
  S.controls.minDistance = 3;


  S.controls.addEventListener(
    "change",
    requestRender
  );


  // ==========================================================
  // SCENE
  // ==========================================================

  theatre();


  // ----------------------------------------------------------
  // LOW-COST AMBIENT LIGHT
  // ----------------------------------------------------------

  S.scene.add(

    new THREE.HemisphereLight(
      0x777777,
      0x101010,
      .3
    )

  );


  // ----------------------------------------------------------
  // LOW-COST FILL
  // ----------------------------------------------------------

  const fill =
    new THREE.DirectionalLight(
      0x777777,
      .2
    );


  fill.position.set(
    0,
    18,
    16
  );


  fill.castShadow = false;

  S.scene.add(fill);


  // ==========================================================
  // GRID
  // ==========================================================

  S.grid =
    new THREE.GridHelper(
      50,
      25,
      0x444444,
      0x222222
    );


  S.grid.position.y = .01;

  S.scene.add(
    S.grid
  );


  // ==========================================================
  // RESIZE
  // ==========================================================

  addEventListener(
    "resize",
    ()=>{

      S.camera.aspect =
        innerWidth/
        innerHeight;


      S.camera.updateProjectionMatrix();


      S.renderer.setSize(
        innerWidth,
        innerHeight,
        false
      );

      S.composer.setSize(
        innerWidth,
        innerHeight
      );


      requestRender();

    }
  );


  requestRender();


  statusText(
    "🟢 READY — drag fixtures then click SAVE"
  );


  requestFixtures();

}


// ============================================================
// OPTIMIZED RENDER LOOP
// ============================================================

function animate(now){

  requestAnimationFrame(
    animate
  );


  const fps =
    S.animated
    ? ACTIVE_FPS
    : IDLE_FPS;


  const frameInterval =
    1000 / fps;


  if(
    now - S.lastRender <
    frameInterval
  ){

    return;

  }


  // ----------------------------------------------------------
  // DMX UPDATE
  // ----------------------------------------------------------
  //
  // Also re-run whenever S.animated is already set (a fixture is
  // strobing) — strobe's flash comes from a sine wave over elapsed
  // time, not from new DMX data, so gating this purely on dmxDirty
  // meant it only ever recomputed once at whatever instant the DMX
  // packet happened to land, then froze there forever.

  if(S.dmxDirty || S.animated){

    updateFixtures(
      now*.001
    );

    updateBeamShadows();

    S.dmxDirty = false;

    S.renderDirty = true;

  }


  // ----------------------------------------------------------
  // HAZE
  // ----------------------------------------------------------

  let hazeActive = false;


  for(
    let i=0;
    i<S.haze.length;
    i++
  ){

    const h =
      S.haze[i];


    if(h.visible){

      h.material.uniforms
        .time.value =
          now*.001;

      hazeActive = true;

    }

  }


  if(hazeActive){

    S.renderDirty = true;

  }


  // ----------------------------------------------------------
  // DISCO BALL
  // ----------------------------------------------------------
  //
  // Speed now comes from whatever's patched as a "Mirror Ball Motor
  // (1ch)" fixture (see js/fixtures.js and the MIRROR BALL MOTOR section
  // of updateFixtures) — that makes this a real, variable-speed value
  // rather than a fixed rate, so unlike the haze pulse elsewhere in this
  // function this has to accumulate rotation += delta each tick instead
  // of computing a deterministic function of elapsed time.
  if(S.discoBall){

    const deltaMs =
      S.discoBallLastTime != null
        ? now-S.discoBallLastTime
        : 0;

    S.discoBallLastTime = now;

    // No motor patched: keep the ball spinning at a clearly-visible idle
    // rate by default (a pleasant default even if nobody bothers wiring
    // one up) — bumped up from this feature's original .15 (which merely
    // reproduced the very first, barely-perceptible now*.0003 rad/ms
    // rate) specifically because a slow turn is hard to notice on a
    // texture-mapped sphere alone. A patched motor takes full,
    // proportional control instead, including genuinely stopping the
    // ball dead at DMX 0 — matching how a real single-channel motor
    // controller works.
    const speedFactor =
      S.discoBallMotorPatched
        ? S.discoBallSpeedLevel
        : .35;

    S.discoBall.rotation.y +=
      deltaMs*.002*speedFactor;

    updateDiscoBallSpots();

    S.renderDirty = true;

  }


  // ----------------------------------------------------------
  // NOTHING CHANGED
  // ----------------------------------------------------------

  if(
    !S.renderDirty &&
    !S.animated
  ){

    return;

  }


  // ----------------------------------------------------------
  // CONTROLS
  // ----------------------------------------------------------

  S.controls.update();


  // ----------------------------------------------------------
  // RENDER
  // ----------------------------------------------------------

  S.composer.render();


  S.lastRender = now;

  S.renderDirty = false;

}


// ============================================================
// START
// ============================================================

init();

// "SAVE POSITIONS" writes dragged fixture layouts to this window's
// own localStorage, but that only ever got read back by manually
// clicking "RESTORE POSITIONS" — closing this window and reopening
// it (e.g. via the "viz"/"visualizer" command) got a fresh page load
// with nothing to read it automatically, so saved positions appeared
// to only ever "stick" the first time. The actual restore now
// happens the first time SYNC_FIXTURES arrives (see the message
// handler above) rather than here, since resolving saved positions
// by fixture id needs the real fixture list to already exist.
connect();

requestAnimationFrame(
  animate
);

</script>
