name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'main.js'
      - 'index.html'
      - 'styles.css'
      - 'js/**'
      - 'package.json'
      - 'package-lock.json'
      - 'relay.js'
      - 'multi-output.js'
      - 'usb-dmx.js'
      - '.github/workflows/build-windows.yml'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run test:syntax

      - name: Build Windows installer and portable app
        run: npm run build-win

      - name: Upload Windows builds
        uses: actions/upload-artifact@v4
        with:
          name: lighting-console-windows
          path: Build/*
          if-no-files-found: error
