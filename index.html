<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Lighting Console</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- The rest of the existing document is preserved. The patch form below intentionally
     has NO per-fixture universe field: output universe routing belongs to Settings. -->

<!-- PATCH -->
<div class="page" id="page-patch">
  <div class="page-grid two-col">
    <section class="panel">
      <div class="panel-header"><div><span class="eyebrow">01</span> Fixture Library</div><span class="panel-meta">SHOWTEC · BETOPPER</span></div>
      <div class="panel-body">
        <div class="search-box">⌕ <input id="fixtureSearch" placeholder="Search Phantom, Wipe, Helix, LPC120..."></div>
        <div id="libList" class="item-list library-list"></div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-header"><div><span class="eyebrow">02</span> Patch Fixture</div><span class="panel-meta">DMX</span></div>
      <div class="panel-body">
        <div class="form-grid">
          <div class="form-row form-span"><label>Name / Fixture</label><input id="patchName" placeholder="Select a fixture from the library"></div>
          <div class="form-row"><label>Type</label><select id="patchType"><option value="dimmer">Dimmer</option><option value="rgb">RGB</option><option value="rgbw">RGBW</option><option value="moving">Moving Head</option><option value="strobe">Strobe</option></select></div>
          <div class="form-row"><label>Start Address</label><input type="number" id="patchAddr" value="1" min="1" max="512"></div>
        </div>
        <div class="action-row">
          <button class="btn-primary" id="btnPatch">＋ Add Fixture</button>
          <button class="btn-danger-soft btn-unpatch-single" id="btnUnpatchSingle">Unpatch Fixture</button>
        </div>
        <small style="display:block;margin-top:8px;opacity:.65">DMX output universe is controlled by Settings. Fixtures do not override the configured Art-Net/sACN/USB output universe.</small>
      </div>
    </section>
  </div>
</div>

<!-- Existing pages/scripts are loaded by the application's normal renderer setup. -->
<script src="js/dmx.js"></script>
<script src="js/fixtures.js"></script>
<script src="js/controls.js"></script>
<script src="js/app.js"></script>
</body>
</html>
