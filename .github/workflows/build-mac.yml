name: Build Mac

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'main.js'
      - 'index.html'
      - 'styles.css'
      - 'js/**'
      - 'package.json'
      - 'package-lock.json'
      - 'relay.js'
      - 'multi-output.js'
      - 'usb-dmx.js'
      - '.github/workflows/build-mac.yml'

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Sync package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Build Mac app
        run: npm run build-mac

      - name: Upload Mac build to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: latest-build
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --title "Latest Build" \
              --notes "Latest Light Spark builds for macOS and Windows." \
              --target "$GITHUB_SHA"
          fi
          find Build -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.zip' \) -print0 | xargs -0 -r gh release upload "$RELEASE_TAG" --clobber
