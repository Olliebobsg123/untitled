<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LX Remote">
<meta name="theme-color" content="#06080b">
<link rel="manifest" href="manifest.webmanifest">
<title>LX Remote</title>
<link rel="stylesheet" href="remote.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z" fill="currentColor"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-look" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
    <symbol id="i-fx" viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M18.5 15.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z" fill="currentColor"/></symbol>
    <symbol id="i-cmd" viewBox="0 0 24 24"><rect x="2.5" y="4" width="19" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M7 9.5l3 2.5-3 2.5M12.5 15h4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-eject" viewBox="0 0 24 24"><path d="M12 5l7 8H5z" fill="currentColor"/><rect x="5" y="16" width="14" height="2.6" rx="1.3" fill="currentColor"/></symbol>
    <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 3v8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M6.6 6.8a7.5 7.5 0 1 0 10.8 0" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2.5" fill="currentColor"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-2.5-6.5z" fill="currentColor"/></symbol>
    <symbol id="i-rec" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6.5" fill="currentColor"/></symbol>
  </defs>
</svg>

<div class="glow" aria-hidden="true"></div>

<div id="login" class="screen" hidden>
  <div class="login-card">
    <div class="logo"><svg><use href="#i-fx"/></svg></div>
    <h1>Light Spark</h1>
    <p class="eyebrow">Remote</p>
    <p id="loginMsg" class="sub">Enter the PIN shown on the console.</p>
    <input id="pin" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="······" autocomplete="one-time-code">
    <button id="pinGo" class="btn primary wide">Connect</button>
  </div>
</div>

<div id="app" class="screen" hidden>
  <header>
    <div class="brand">
      <div id="status" class="dot"></div>
      <div>
        <div class="eyebrow">Light Spark</div>
        <div id="title">Remote</div>
      </div>
    </div>
    <span id="mode" class="chip" hidden></span>
    <button id="eject" class="icon-btn" hidden aria-label="Disconnect"><svg><use href="#i-eject"/></svg></button>
    <button id="blackout" class="pill-btn danger" aria-label="Blackout"><svg><use href="#i-power"/></svg><span>Blackout</span></button>
  </header>

  <main>
    <section id="tab-play" class="tab active">
      <div class="hero">
        <div class="eyebrow">Live</div>
        <div id="nowplaying" class="now">No cue active</div>
        <div id="nextup" class="next"></div>
      </div>
      <div class="go-row">
        <button id="back" class="btn back" aria-label="Back"><svg><use href="#i-back"/></svg><span>Back</span></button>
        <button id="go" class="btn go"><span class="go-word">GO</span><span id="goNext" class="go-sub"></span></button>
      </div>
      <h3>Cue list</h3>
      <div id="cues" class="list"></div>
    </section>

    <section id="tab-look" class="tab">
      <div class="card">
        <label><span>Intensity</span><span class="val"><b id="intVal">100</b>%</span></label>
        <input id="intensity" type="range" min="0" max="100" class="fill">
        <div class="seg">
          <button data-int="0" class="seg-btn">Out</button><button data-int="25" class="seg-btn">25</button><button data-int="50" class="seg-btn">50</button><button data-int="75" class="seg-btn">75</button><button data-int="100" class="seg-btn">Full</button>
        </div>
      </div>
      <div class="card">
        <label><span>Colour</span><span id="colourPreview" class="preview"></span></label>
        <div id="swatches" class="swatches"></div>
        <label><span>Hue</span><span class="val"><b id="hueVal">0</b>°</span></label>
        <input id="hue" type="range" min="0" max="360" class="hue">
        <label><span>Saturation</span><span class="val"><b id="satVal">0</b>%</span></label>
        <input id="sat" type="range" min="0" max="100" class="sat">
      </div>
      <div class="card">
        <label><span>Strobe</span><span class="val"><b id="strobeVal">0</b></span></label>
        <input id="strobe" type="range" min="0" max="255" class="fill warm">
      </div>
    </section>

    <section id="tab-select" class="tab">
      <div class="toolbar">
        <div class="seg small">
          <button id="selAll" class="seg-btn">All</button><button id="selNone" class="seg-btn">None</button>
        </div>
        <span id="selCount" class="muted"></span>
      </div>
      <h3>Groups</h3>
      <div id="groups" class="grid"></div>
      <h3>Fixtures</h3>
      <div id="fixtures" class="grid fixtures"></div>
    </section>

    <section id="tab-fx" class="tab">
      <h3>Palettes</h3>
      <div id="palettes" class="grid"></div>
      <div class="h3-row"><h3>Chases</h3><button id="stopChase" class="pill-btn"><svg><use href="#i-stop"/></svg><span>Stop</span></button></div>
      <div id="chases" class="grid"></div>
    </section>

    <section id="tab-cmd" class="tab">
      <h3>Command</h3>
      <form id="cmdForm" class="field">
        <input id="cmdText" placeholder="1 thru 4 @ 50" autocapitalize="none" autocorrect="off" spellcheck="false">
        <button class="field-btn" aria-label="Send"><svg><use href="#i-send"/></svg></button>
      </form>
      <h3>Record cue</h3>
      <form id="recForm" class="field">
        <input id="recNum" inputmode="decimal" placeholder="#" class="narrow">
        <input id="recName" placeholder="Name">
        <button class="field-btn rec" aria-label="Record"><svg><use href="#i-rec"/></svg></button>
      </form>
      <h3>Console</h3>
      <div id="cmdLog" class="log"><div class="muted">Messages from the console show here.</div></div>
    </section>
  </main>

  <nav>
    <div class="tabbar">
      <button data-tab="play" class="active"><svg><use href="#i-play"/></svg><span>Play</span></button>
      <button data-tab="look"><svg><use href="#i-look"/></svg><span>Look</span></button>
      <button data-tab="select"><svg><use href="#i-grid"/></svg><span>Select</span></button>
      <button data-tab="fx"><svg><use href="#i-fx"/></svg><span>FX</span></button>
      <button data-tab="cmd"><svg><use href="#i-cmd"/></svg><span>Cmd</span></button>
    </div>
  </nav>
  <div id="toast"></div>
</div>
<script src="remote.js"></script>
</body>
</html>
