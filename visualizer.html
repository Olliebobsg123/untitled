<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Light Spark Visualiser</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body, #viz { width: 100%; height: 100%; overflow: hidden; }
  body { background: #07080a; color: #e8eeec; font: 13px/1.4 Inter, "Segoe UI", system-ui, sans-serif; }
  #viz canvas { display: block; }
  .panel { position: fixed; z-index: 2; background: rgba(9, 13, 15, .86); border: 1px solid #263036; border-radius: 10px; backdrop-filter: blur(6px); }
  #ui { left: 14px; top: 14px; padding: 12px; display: grid; gap: 6px; width: 190px; }
  #ui h1 { font: 800 11px/1 ui-monospace, Menlo, monospace; letter-spacing: .16em; color: #19d6a3; margin: 2px 2px 6px; }
  button { padding: 8px 10px; background: #12191c; color: #dfe8e6; border: 1px solid #2b373c; border-radius: 7px; cursor: pointer; font: 600 12px/1.2 inherit; text-align: left; }
  button:hover { border-color: #19d6a3; }
  button.on { background: #0f2a22; border-color: #19d6a3; color: #b9f5e2; }
  #status { right: 14px; top: 14px; padding: 8px 12px; font: 600 12px/1.3 ui-monospace, Menlo, monospace; color: #9fb0ad; }
  #mode { right: 14px; top: 52px; padding: 6px 12px; font: 800 12px/1.3 ui-monospace, Menlo, monospace; letter-spacing: .14em; color: #8bc5ff; border-color: #5ca8ff; }
  #selection { left: 50%; bottom: 14px; transform: translateX(-50%); padding: 8px 14px; font-weight: 600; }
  #selection:empty { display: none; }
  #help { left: 14px; bottom: 14px; padding: 9px 12px; color: #8a9a97; font-size: 12px; max-width: 360px; }
  #help b { color: #cfdcd9; }
</style>
<script type="importmap">
{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<div id="viz"></div>
<div id="ui" class="panel">
  <h1>THEATRE</h1>
  <button id="house" type="button">House lights</button>
  <button id="work" type="button">Work lights</button>
  <button id="beams" type="button">Beams</button>
  <button id="grid" type="button">Grid</button>
  <button id="resetView" type="button">Reset view</button>
  <button id="resetLayout" type="button">Reset fixture positions</button>
</div>
<div id="status" class="panel">Starting…</div>
<div id="mode" class="panel" hidden>BLIND</div>
<div id="selection" class="panel"></div>
<div id="help" class="panel"><b>Drag</b> a fixture to move it (<b>Shift</b> to raise or lower it). <b>Drag the lens</b> of a fixed light to aim it. <b>Drag the background</b> to look around, <b>right-drag</b> to slide, <b>scroll</b> to zoom. Positions are saved with the show.</div>
<script type="module" src="js/visualizer/main.js"></script>
</body>
</html>
