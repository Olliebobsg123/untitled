name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'main.js'
      - 'index.html'
      - 'styles.css'
      - 'js/**'
      - 'package.json'
      - 'package-lock.json'
      - 'relay.js'
      - 'multi-output.js'
      - 'usb-dmx.js'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Sync package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer and portable app
        run: npm run build-win

      - name: Upload Windows builds to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: latest-build
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --title "Latest Build" \
              --notes "Latest Light Spark builds for macOS and Windows." \
              --target "$GITHUB_SHA"
          fi
          files=$(find Build -maxdepth 1 -type f \( -iname '*.exe' -o -iname '*.msi' -o -iname '*.zip' \) -print)
          if [ -z "$files" ]; then
            echo "No Windows installer files found in Build/"
            find Build -maxdepth 2 -type f -print
            exit 1
          fi
          gh release upload "$RELEASE_TAG" $files --clobber
