name: Remove per-fixture universe patching
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/central-output-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove per-fixture universe routing and use Settings output
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # DMX engine: remove the entire per-fixture/multi-universe routing layer.
          p = Path('js/dmx.js')
          s = p.read_text()
          marker = '// Multi-universe output:'
          start = s.find(marker)
          if start != -1:
              s = s[:start].rstrip() + '\n'

          old = '''send(){
          if(this.enabled&&ws?.readyState===WebSocket.OPEN)ws.send(this.makePacket(State.dmx,this.universe));
          sendVisualizerDMX();
          },'''
          new = '''send(){
          if(this.enabled&&ws?.readyState===WebSocket.OPEN){
            const settings=window.DMXOutputSettings||{};
            const protocol=String(settings.protocol||window.DMXOutputProtocol||"artnet").toLowerCase();
            const configured=Number(settings.universe);
            const universe=Number.isFinite(configured)?configured:(protocol==="sacn"?1:0);
            ws.send(JSON.stringify({
              type:"DMX_UPDATE",
              universe:protocol==="sacn"?Math.max(1,universe):Math.max(0,universe),
              dmx:Array.from(State.dmx)
            }));
          }
          sendVisualizerDMX();
          },'''
          if old not in s:
              raise SystemExit('Expected ArtNet.send block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # Settings: expose the exact central output configuration to the DMX engine.
          p = Path('js/modes.js')
          s = p.read_text()
          marker = '  function sendOutputConfig(enabled){'
          helper = '''  function syncCentralOutputSettings(){
            const cfg=outputSettings||{};
            window.DMXOutputSettings={...cfg};
            window.DMXOutputProtocol=String(cfg.protocol||"artnet").toLowerCase();
            if(window.ArtNet){
              window.ArtNet.outputProtocol=window.DMXOutputProtocol;
              window.ArtNet.universe=Number(cfg.universe)||0;
            }
          }

'''
          if 'function syncCentralOutputSettings()' not in s:
              if marker not in s: raise SystemExit('Settings output marker not found')
              s = s.replace(marker, helper + marker, 1)
          s = s.replace('''  function sendOutputConfig(enabled){
    const cfg=readOutputSettings();''', '''  function sendOutputConfig(enabled){
    const cfg=readOutputSettings();
    syncCentralOutputSettings();''', 1)
          s = s.replace('''    modeSelect.value=outputSettings.protocol==="sacn"?"sACN":"Art-Net";
    syncOutputFields();''', '''    modeSelect.value=outputSettings.protocol==="sacn"?"sACN":"Art-Net";
    syncOutputFields();
    syncCentralOutputSettings();''', 1)
          s = s.replace('''    modeSelect.onchange=()=>{syncOutputFields();};''', '''    modeSelect.onchange=()=>{syncOutputFields();syncCentralOutputSettings();};''', 1)
          s = s.replace('''    [$("artnetIp"),$("artnetUni"),$("sacnPriority"),$("sacnMulticast"),$("sacnSourceName")].forEach(el=>el?.addEventListener("change",()=>{syncOutputFields();}));''', '''    [$("artnetIp"),$("artnetUni"),$("sacnPriority"),$("sacnMulticast"),$("sacnSourceName")].forEach(el=>el?.addEventListener("change",()=>{syncOutputFields();syncCentralOutputSettings();}));''', 1)
          p.write_text(s)

          # Patch UI/logic: no universe field, no per-fixture universe value, no universe overlap test.
          p = Path('index.html')
          s = p.read_text()
          s = re.sub(r'\s*<div class="form-row">\s*<label>Universe</label>\s*<input[^>]*id="patchUni"[^>]*>\s*</div>', '', s, flags=re.I)
          p.write_text(s)

          p = Path('js/app.js')
          s = p.read_text()
          s = s.replace('''    const uni = Number($("patchUni")?.value || 1);
    const addr = Number($("patchAddr")?.value || 1);''', '''    const addr = Number($("patchAddr")?.value || 1);''', 1)
          s = re.sub(r'''\n    if \(!Number\.isInteger\(uni\) \|\| uni < 0\) \{.*?\n    \}\n''', '\n', s, count=1, flags=re.S)
          s = re.sub(r'''\n    const overlap = State\.fixtures\.some\(fixture => \{.*?\n    \}\);\n''', '\n', s, count=1, flags=re.S)
          s = re.sub(r'''\n    if \(\n      overlap &&\n      !confirm\(`DMX \$\{addr\}-\$\{end\} is already used\. Overwrite\?`\)\n    \) return;\n''', '\n', s, count=1, flags=re.S)
          s = s.replace('''    State.fixtures.push({ id, name, uni, addr, fixtureNumber });''', '''    State.fixtures.push({ id, name, addr, fixtureNumber });''', 1)
          s = s.replace('''    log(`Patched: #${fixtureNumber} ${name} → Uni ${uni} Addr ${addr}`, "ok");''', '''    log(`Patched: #${fixtureNumber} ${name} → Addr ${addr} (output follows Settings)`, "ok");''', 1)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/dmx.js js/modes.js js/app.js index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Remove per-fixture universe patching'
          git push
