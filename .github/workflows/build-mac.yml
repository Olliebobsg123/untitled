name: Build Mac

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'tests/**'
      - '.github/workflows/diagnose-windows.yml'

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Sync package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci

      # Every build gets its own version (1.0.<number of commits>), so a
      # running Light Spark can tell a newer one is out. Mac and Windows
      # builds of the same commit get the same number.
      - name: Set version
        shell: bash
        run: npm version "1.0.$(git rev-list --count HEAD)" --no-git-tag-version --allow-same-version

      - name: Validate JavaScript
        run: npm run test:syntax

      - name: Build Mac app
        run: npm run build-mac

      - name: Upload Mac build to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: latest-build
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --title "Latest Build" \
              --notes "Latest Light Spark builds for macOS and Windows." \
              --target "$GITHUB_SHA"
          fi
          find Build -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.blockmap' -o -name 'latest-mac.yml' \) -print0 | xargs -0 -r gh release upload "$RELEASE_TAG" --clobber
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.assets[] | select(.name | test("^Lighting.Console-[0-9.]+-arm64")) | .id' |
            while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id"; done
