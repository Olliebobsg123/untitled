<script type="module">

import * as THREE from "three";
import {OrbitControls} from "three/addons/controls/OrbitControls.js";
import {EffectComposer} from "three/addons/postprocessing/EffectComposer.js";
import {RenderPass} from "three/addons/postprocessing/RenderPass.js";
import {UnrealBloomPass} from "three/addons/postprocessing/UnrealBloomPass.js";
import {OutputPass} from "three/addons/postprocessing/OutputPass.js";
import {RoomEnvironment} from "three/addons/environments/RoomEnvironment.js";

const $ = id => document.getElementById(id);
const status = $("status");


// ============================================================
// PERFORMANCE
// ============================================================

const IDLE_FPS = 24;
const ACTIVE_FPS = 30;

const MAX_PIXEL_RATIO = 1.0;

// Light contributions physically SUM in the scene, so a handful of
// fixtures tuned to look right together blows the beams/floor out to
// solid white once a real rig's worth (20-30+) are all on at once.
// The fix is BLOOM strength, not exposure: an earlier version of this
// scaled toneMappingExposure down instead, which did stop the
// blowout, but exposure applies to the WHOLE tone-mapped image
// uniformly — it just as strongly darkened the curtains/seats/truss
// (lit only by modest ambient/incidental light to begin with) right
// down to invisible black, while the haze beam cones (a raw, un-
// tonemapped ShaderMaterial — see hazeMaterial()) were completely
// unaffected either way, exactly matching "the set disappears but
// the beams stay on". Bloom's glow is what was actually washing the
// hotspots out to solid white, and dialing THAT down instead leaves
// every non-hotspot surface's own brightness alone.
const BASE_TONE_EXPOSURE = 1.8;
const BASE_BLOOM_STRENGTH = .4;
const REFERENCE_ACTIVE_LIGHTS = 3;

// GPUs/drivers cap how many simultaneous real-time per-pixel lights a
// shader program can use — past that limit, materials that depend on
// the scene's shared light list (curtains, seats, stairs, truss, the
// floor) can render as if completely unlit, while each fixture's own
// haze beam keeps working fine regardless (it's a self-lit, un-
// tonemapped material — see hazeMaterial() — never counted on the
// scene's light list at all). Confirmed repro: fine at 12 real
// lights on, breaks at 13. Rather than chase the exact hardware
// limit (it'll vary by GPU), only the brightest MAX_REAL_LIGHTS
// fixtures at any moment ever get a real, scene-affecting SpotLight
// — every other active fixture still shows its own beam and colour
// correctly, it just stops additionally lighting up the static set.
// Kept well under the observed 12-light cutoff to leave headroom for
// house/work lights (which share the same per-pixel light budget)
// and for weaker GPUs than the one that hit this limit.
const MAX_REAL_LIGHTS = 8;

// Shadow-casting is far more expensive per-light than plain illumination —
// each shadow-casting light needs its own extra depth-only render of the
// scene every frame, on top of the real-time per-pixel light cost that
// MAX_REAL_LIGHTS above is already balancing. Casting shadows from all 8
// budgeted lights at once would multiply that cost 8x for comparatively
// little visual gain (most of a rig's beams overlap on the same floor/
// truss, so more than a couple of shadows rarely reads as "more real").
// Kept as its own, smaller, same-patch-order-priority budget rather than
// just reusing MAX_REAL_LIGHTS.
const MAX_SHADOW_LIGHTS = 3;

// How many candidate facets S.discoBall is sampled at (see the DISCO BALL
// SPOTS comment in theatre()) — only whichever subset currently faces
// DISCO_BALL_KEY_LIGHT_DIRECTION actually shows a landing spot, so the
// real number visible at once is normally well under this.
const DISCO_BALL_SPOT_COUNT = 110;

// How far a disco ball spot's reflected ray is allowed to travel looking
// for a surface to land on — a reflection that doesn't hit anything
// within this range (aimed out through a doorway, say) just isn't shown,
// rather than projecting a spot into empty space. Kept fairly short
// (well under the room's own full scale) so spots stay visually
// connected to the ball itself rather than scattering off in ones and
// twos to distant far walls, which read as disconnected specks rather
// than an obvious effect coming from the ball anyone's actually looking
// at.
const DISCO_BALL_SPOT_MAX_DISTANCE = 14;

// The facingLight range (see updateDiscoBallSpots) a facet's brightness
// fades smoothly across, rather than popping fully on/off at one hard
// threshold — a facet rotating through alignment with the key light now
// glints in and out gradually, the way a real mirror tile actually
// catches and loses a light source, not a binary flicker.
const DISCO_BALL_SPOT_FADE_START = .05;
const DISCO_BALL_SPOT_FADE_END = .35;

// The direction light is assumed to be travelling IN (from source to
// ball) when computing each facet's reflection — see
// updateDiscoBallSpots. A real disco ball only sparkles from whichever
// tiles actually catch a nearby light; this stands in for that as a
// simple fixed assumption rather than searching every active fixture for
// whichever one is actually aimed at the ball. Deliberately NOT pointing
// straight down (0,-1,0) — that direction's dot product with any facet
// normal is unaffected by the ball's own Y-axis rotation, which would
// freeze the lit/unlit facet pattern in place instead of sweeping as it
// spins.
const DISCO_BALL_KEY_LIGHT_DIRECTION =
  new THREE.Vector3(.6,-.7,.35).normalize();

// A fixture past the MAX_REAL_LIGHTS budget above still shows its own beam
// and colour correctly (see the comment above) — it just has no real
// THREE.SpotLight, so it casts no actual photons onto the floor/set the way
// a real stage light would. Past ~8-10 active fixtures that reads as "the
// beam stops landing on the floor": the haze cone is still visible in the
// air, but there's no glowing pool where it would hit the ground. FLOOR_SPOT
// is a cheap, unlit additive decal placed at the beam's own floor/stage
// intersection point — same trick as the haze cone (self-lit, never on the
// scene's real light list) — so every fixture gets a landing spot
// regardless of the real-light budget. See S.groundMeshes (set in
// theatre() below) for what it can actually land on.

// Must match MAX_UNIVERSES/DMX_CHANNELS in js/dmx.js — the console's
// State.dmx spans every patch universe end-to-end (fixture.uni 1-10) rather
// than a single 512-channel block, and sends that whole buffer here on
// every DMX_UPDATE. address() below folds the same universe offset in when
// looking up each fixture's slice, so this buffer needs to be the same
// total size or every fixture past universe 1 reads someone else's channels.
const DMX_CHANNELS = 512;
const MAX_UNIVERSES = 10;
const DMX_TOTAL_CHANNELS = DMX_CHANNELS*MAX_UNIVERSES;


// ============================================================
// STATE
// ============================================================

const S = {

  dmx:new Uint8Array(DMX_TOTAL_CHANNELS),

  fixtures:[],
  fixturePositions:new Map(),
  fixtureManualRot:new Map(),
  autoRestoredPositions:false,

  library:{},

  objects:[],
  house:[],
  work:[],
  haze:[],

  scene:null,
  camera:null,
  renderer:null,
  controls:null,
  grid:null,

  packets:0,

  selectedFixture:null,
  selectedAim:null,

  dragOffset:new THREE.Vector3(),
  dragPlane:new THREE.Plane(),

  dmxDirty:true,

  fixtureCache:new Map(),

  renderDirty:true,
  lastRender:0,

  animated:false,

  lastFixtureUpdate:0,

  // Cached raycast lists.
  fixtureBodies:[],
  aimHeads:[],

  // Shared fixture resources, keyed by archetype (movingHead/fresnel/parCan/strobe).
  fixtureGeometry:null,
  fixtureMaterial:null,
  fixtureBulbMaterial:null,

  // Used to avoid unnecessary material updates.
  lastFixtureColours:[],
  lastFixtureIntensity:[],

  // Number of currently active fixture lights.
  activeLights:0

};


window.S = S;
window.VizState = S;
window.rebuildFixtures = rebuildFixtures;
window.applyLoadedPositions = applyLoadedPositions;


if(window.opener){

  window.opener.S = S;
  window.opener.VizState = S;
  window.opener.rebuildFixtures = rebuildFixtures;
  window.opener.applyLoadedPositions = applyLoadedPositions;

}


// ============================================================
// CONNECTION
// ============================================================

let ws;
let reconnect;


// ============================================================
// UI STATE
// ============================================================

let houseOn = false;
let workOn = false;
let gridOn = true;


// ============================================================
// TEMP VECTORS
// ============================================================

const tempDirection = new THREE.Vector3();
const tempWorldPosition = new THREE.Vector3();
const tempTargetPosition = new THREE.Vector3();

// updateBeamShadows()'s own scratch vector for reading each shadow-slotted
// fixture's target world position — kept separate from tempTargetPosition
// above since that one is mid-use inside updateFixtures() at the point
// updateBeamShadows() runs (right after it, from animate()).
const beamShadowTempTarget = new THREE.Vector3();

// updateDiscoBallSpots()'s own scratch objects — reused across all
// DISCO_BALL_SPOT_COUNT candidate facets every frame rather than
// allocating fresh Vector3/Quaternion/Matrix4/Raycaster instances per
// facet per frame.
const discoBallFacetNormal = new THREE.Vector3();
const discoBallSpotDirection = new THREE.Vector3();
const discoBallSpotOrigin = new THREE.Vector3();
const discoBallSpotQuaternion = new THREE.Quaternion();
const discoBallSpotUpAxis = new THREE.Vector3(0,0,1);
const discoBallSpotMatrix = new THREE.Matrix4();
const discoBallSpotScale = new THREE.Vector3();
const discoBallRaycaster = new THREE.Raycaster();
const discoBallSpotWhite = new THREE.Color(1,1,1);

// Dedicated raycaster for the FLOOR SPOT beam/ground intersection in
// updateFixtures() — separate from the mouse-interaction `raycaster`
// below so a fixture's per-frame ground check can never stomp on
// mid-drag mouse-picking state (or vice versa).
const beamRaycaster = new THREE.Raycaster();

const panAxis = new THREE.Vector3(0,1,0);
const tiltAxis = new THREE.Vector3(1,0,0);

const mousePlane =
  new THREE.Plane(
    new THREE.Vector3(0,1,0),
    0
  );

const mouseTarget = new THREE.Vector3();
const mouseIntersect = new THREE.Vector3();
const mouseDirection = new THREE.Vector3();


// ============================================================
// SHARED FIXTURE RESOURCES
// ============================================================
//
// IMPORTANT:
//
// Thousands of fixtures no longer create thousands of identical
// Geometry + Material objects.
//
// Geometry and materials are shared between every fixture.
//
// This saves a LOT of memory and reduces WebGL state overhead.
//

// ============================================================
// FIXTURE ARCHETYPES
// ============================================================
//
// Different fixture *types* no longer share one generic box rig.
// Each archetype gets its own body/yoke/head silhouette and
// mounting offsets, while every archetype still shares the exact
// same rig TOPOLOGY (mount -> body, mount -> panGroup -> yoke ->
// tiltGroup -> head/bulb/spot/haze/target) so the rest of the
// update loop doesn't need to know which archetype it's driving.
//
// Geometry + materials are still shared PER ARCHETYPE (not per
// fixture instance), so a patch of 200 PAR cans still only owns
// one geometry/material set between them — the original memory
// optimization is preserved, just no longer collapsed down to a
// single universal shape.

const ARCHETYPE_LAYOUT = {

  movingHead:{
    yokeOffsetX:.4,  yokeY:-.6,
    tiltGroupY:-.85, bulbY:-.5
  },

  // Bigger, boxier head than movingHead (see its geometry in
  // createSharedFixtureResources) — a real wash fixture's whole draw is
  // a wide, flat LED cluster behind one big lens, not a compact focused
  // barrel, so the mount offsets scale up to match rather than reusing
  // movingHead's numbers on a bigger shell.
  movingWash:{
    yokeOffsetX:.46, yokeY:-.66,
    tiltGroupY:-.92, bulbY:-.58
  },

  // Smaller, narrower head than movingHead — a real beam fixture (e.g.
  // a Sharpy-style unit) is built around a tiny, tightly-focused lens in
  // a compact "gun barrel" housing, noticeably smaller than either a
  // wash or a general-purpose spot.
  movingBeam:{
    yokeOffsetX:.3,  yokeY:-.42,
    tiltGroupY:-.58, bulbY:-.35
  },

  fresnel:{
    yokeOffsetX:.34, yokeY:-.45,
    tiltGroupY:-.62, bulbY:-.32
  },

  parCan:{
    yokeOffsetX:.28, yokeY:-.35,
    tiltGroupY:-.46, bulbY:-.22
  },

  strobe:{
    yokeOffsetX:.62, yokeY:-.32,
    tiltGroupY:-.4,  bulbY:-.18
  },

  // Static (no pan/tilt) archetypes still need every field this object
  // provides — the shared rig topology (see the comment above) builds a
  // yoke/tiltGroup for every archetype regardless of whether DMX ever
  // actually rotates it (see hasDMXPanTilt in makeFixture) — but with no
  // moving parts to hide, these can be small/nominal rather than shaped
  // like a real yoke bracket.
  staticBar:{
    yokeOffsetX:0,   yokeY:-.12,
    tiltGroupY:-.16, bulbY:-.02
  },

  blinder:{
    yokeOffsetX:0,   yokeY:-.18,
    tiltGroupY:-.28, bulbY:-.06
  }

};

function fixtureArchetype(def,hasDMXPanTilt){

  const type =
    String(def?.type||"").toLowerCase();

  if(hasDMXPanTilt){

    // "wash"/"beam" are real, deliberate library type values (see
    // js/fixtures.js) alongside the pre-existing "moving" — a moving
    // fixture with neither of those (including plain "moving", used by
    // gobo/spot fixtures) keeps the original movingHead shell, which was
    // always meant to read as a general-purpose moving spot.
    if(type === "wash")
      return "movingWash";

    if(type === "beam")
      return "movingBeam";

    return "movingHead";

  }

  if(type === "strobe")
    return "strobe";

  if(type === "dimmer" || type === "tungsten")
    return "fresnel";

  if(type === "blinder")
    return "blinder";

  // A static, no-pan/tilt LED bar/batten — see "bar" (not "moving") in
  // js/fixtures.js's new Light Bar entries.
  if(type === "bar")
    return "staticBar";

  // rgb / rgbw / rgbal / rgbalc / unknown static fixtures.
  return "parCan";

}

// Real fixture "beam angle" specs are FULL cone angles in degrees.
// THREE.SpotLight.angle is the HALF angle, in radians.
function degToHalfAngleRad(deg){
  return THREE.MathUtils.degToRad(deg/2);
}

// Cheap, standard (Tanner Helland) Kelvin -> normalised RGB
// approximation, used only to tint plain dimmer/tungsten fixtures
// that have no RGB channels toward their real colour temperature
// instead of rendering as flat white.
function kelvinToRGB(kelvin){

  const temp = kelvin/100;
  let r,g,b;

  if(temp <= 66){
    r = 255;
    g = 99.47 * Math.log(temp) - 161.12;
  }else{
    r = 329.7 * Math.pow(temp-60,-.133);
    g = 288.12 * Math.pow(temp-60,-.0755);
  }

  b = temp >= 66 ? 255
    : temp <= 19 ? 0
    : 138.52 * Math.log(temp-10) - 305.04;

  const clamp = v => Math.min(255,Math.max(0,v))/255;

  return {
    r:clamp(r),
    g:clamp(g),
    b:clamp(b)
  };

}

// ============================================================
// FRAMING SHUTTERS
// ============================================================
//
// 4 independent blades, each with its own insertion depth and
// rotation, projected onto the SpotLight's cone via THREE's
// built-in light-cookie mechanism (SpotLight.map). Each blade
// blacks out the half-plane beyond its own edge line; the union
// of all 4 blacked-out half-planes (drawn on top of a white
// "fully open" canvas) gives exactly the same result as the real
// intersection-of-open-apertures a physical shutter assembly
// produces — a rectangle when all 4 sit at their default cross
// pattern, an arbitrary rotated shape otherwise.

const SHUTTER_BASE_DEG = [0,90,180,270];

// ============================================================
// GOBO PATTERNS
// ============================================================
//
// Simple, stylised procedural patterns — not manufacturer gobo
// artwork (no such asset exists here), just clearly distinct
// selectable shapes so a gobo choice is actually visible on the
// beam. DMX gobo-select value is divided into 8 equal buckets;
// bucket 0 is always "Open" (no pattern, full beam).

function drawGoboDots(ctx,r){
  ctx.beginPath();
  for(let ring=1;ring<=2;ring++){
    const count = ring*6;
    const rr = r*(ring/3);
    for(let i=0;i<count;i++){
      const a = (i/count)*Math.PI*2;
      ctx.moveTo(Math.cos(a)*rr+r*.13,Math.sin(a)*rr);
      ctx.arc(Math.cos(a)*rr,Math.sin(a)*rr,r*.09,0,Math.PI*2);
    }
  }
  ctx.fill();
}

function drawGoboRings(ctx,r){
  ctx.lineWidth = r*.12;
  ctx.strokeStyle = "#fff";
  [.3,.55,.8].forEach(f=>{
    ctx.beginPath();
    ctx.arc(0,0,r*f,0,Math.PI*2);
    ctx.stroke();
  });
}

function drawGoboBreakup(ctx,r){
  const blobs = [
    [-.4,-.3,.22],[.35,-.4,.18],[.1,.05,.28],
    [-.3,.35,.2],[.45,.3,.16],[-.05,-.55,.15]
  ];
  ctx.beginPath();
  blobs.forEach(([x,y,rad])=>{
    ctx.moveTo((x+rad)*r,y*r);
    ctx.arc(x*r,y*r,rad*r,0,Math.PI*2);
  });
  ctx.fill();
}

function drawGoboStripes(ctx,r){
  const wedges = 8;
  ctx.beginPath();
  for(let i=0;i<wedges;i+=2){
    const a0 = (i/wedges)*Math.PI*2;
    const a1 = ((i+1)/wedges)*Math.PI*2;
    ctx.moveTo(0,0);
    ctx.arc(0,0,r,a0,a1);
    ctx.closePath();
  }
  ctx.fill();
}

function drawGoboStar(ctx,r){
  const points = 5;
  ctx.beginPath();
  for(let i=0;i<points*2;i++){
    const a = (i/(points*2))*Math.PI*2 - Math.PI/2;
    const rr = i%2===0 ? r*.9 : r*.36;
    const x = Math.cos(a)*rr, y = Math.sin(a)*rr;
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.closePath();
  ctx.fill();
}

function drawGoboTriangle(ctx,r){
  ctx.beginPath();
  for(let i=0;i<3;i++){
    const a = (i/3)*Math.PI*2 - Math.PI/2;
    const x = Math.cos(a)*r*.85, y = Math.sin(a)*r*.85;
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.closePath();
  ctx.fill();
}

function drawGoboWindows(ctx,r){
  const n = 3;
  const cell = (r*1.6)/n;
  ctx.beginPath();
  for(let x=0;x<n;x++){
    for(let y=0;y<n;y++){
      const cx = -r*.8 + cell*x + cell*.5;
      const cy = -r*.8 + cell*y + cell*.5;
      ctx.rect(cx-cell*.32,cy-cell*.32,cell*.64,cell*.64);
    }
  }
  ctx.fill();
}

const GOBO_DRAWERS = [
  null, // 0 = Open, handled separately
  drawGoboDots,
  drawGoboRings,
  drawGoboBreakup,
  drawGoboStripes,
  drawGoboStar,
  drawGoboTriangle,
  drawGoboWindows
];

function drawGoboPattern(ctx,size,gobo){

  if(!gobo || gobo.pattern <= 0){
    ctx.fillStyle = "#fff";
    ctx.fillRect(0,0,size,size);
    return;
  }

  ctx.fillStyle = "#000";
  ctx.fillRect(0,0,size,size);

  const drawer =
    GOBO_DRAWERS[gobo.pattern] || null;

  if(!drawer) return;

  ctx.save();
  ctx.translate(size/2,size/2);
  ctx.rotate(gobo.rotateRad || 0);
  ctx.fillStyle = "#fff";
  drawer(ctx,size/2);
  ctx.restore();

}

// Stamps the canvas's current contents onto itself several more
// times at rotated offsets, using additive blending — the 2D
// approximation of a prism facet splitting the beam into several
// duplicate images (see the PRISM comment in updateFixtures for
// why this is the honest simplification here rather than a true
// multi-beam optic).
function applyPrismEffect(ctx,size,facets,rotateRad){

  if(!facets || facets<=1)
    return;

  const snapshot =
    document.createElement("canvas");

  snapshot.width = size;
  snapshot.height = size;
  snapshot.getContext("2d").drawImage(ctx.canvas,0,0);

  ctx.save();
  ctx.globalCompositeOperation = "lighter";

  for(let i=1;i<facets;i++){

    const angle =
      rotateRad + (i/facets)*Math.PI*2;

    ctx.save();
    ctx.translate(size/2,size/2);
    ctx.rotate(angle);
    ctx.translate(-size/2,-size/2);
    ctx.drawImage(snapshot,0,0);
    ctx.restore();

  }

  ctx.restore();

}

// Blurs the canvas's current contents in place — used for the
// frost/diffusion filter's effect on the projected gobo/shutter
// pattern, on top of its separate effect on the beam's own edge
// softness (spot.penumbra, set directly in updateFixtures).
function applyFrostBlur(ctx,size,blurPx){

  if(!blurPx || blurPx<=0)
    return;

  const snapshot =
    document.createElement("canvas");

  snapshot.width = size;
  snapshot.height = size;
  snapshot.getContext("2d").drawImage(ctx.canvas,0,0);

  ctx.clearRect(0,0,size,size);
  ctx.save();
  ctx.filter = `blur(${blurPx}px)`;
  ctx.drawImage(snapshot,0,0);
  ctx.restore();

}

function drawShutterMask(ctx,size,blades,gobo,gobo2,prism,frostBlur){

  drawGoboPattern(ctx,size,gobo);

  // A second gobo wheel sits physically in series with the first
  // — its aperture multiplies with whatever the first wheel just
  // let through, exactly what "multiply" blending gives here for
  // free (white * anything = unchanged, black * anything = black).
  if(gobo2 && gobo2.pattern > 0){
    ctx.save();
    ctx.globalCompositeOperation = "multiply";
    drawGoboPattern(ctx,size,gobo2);
    ctx.restore();
  }

  ctx.fillStyle = "#000";

  const radius = size/2;

  blades.forEach(blade=>{

    if(blade.insert <= 0)
      return;

    const angleRad =
      THREE.MathUtils.degToRad(blade.angleDeg);

    // 0 = edge sits at the aperture rim (blocks nothing),
    // 1 = edge passes through the centre (blocks half).
    const dist =
      radius - blade.insert*radius;

    ctx.save();

    ctx.translate(radius,radius);
    ctx.rotate(angleRad);

    ctx.fillRect(dist,-size,size*2,size*2);

    ctx.restore();

  });

  if(prism)
    applyPrismEffect(ctx,size,prism.facets,prism.rotateRad);

  if(frostBlur)
    applyFrostBlur(ctx,size,frostBlur);

}

function createSharedFixtureResources(){

  S.fixtureGeometry = {

    movingHead:{
      body:new THREE.BoxGeometry(1,.6,1),
      yoke:new THREE.BoxGeometry(.12,.9,.12),
      head:new THREE.BoxGeometry(.75,.8,1),
      bulb:new THREE.SphereGeometry(.25,6,6)
    },

    // Wide, boxy head with a big drum-shaped lens housing — a real wash
    // fixture's whole draw is a flat cluster of LEDs behind one large
    // lens, not a compact focused barrel.
    movingWash:{
      body:new THREE.BoxGeometry(1.1,.65,1.1),
      yoke:new THREE.BoxGeometry(.14,1,.14),
      head:new THREE.CylinderGeometry(.62,.62,.55,20),
      bulb:new THREE.SphereGeometry(.4,10,10)
    },

    // Small, narrow "gun barrel" head — a real beam fixture (e.g. a
    // Sharpy-style unit) is built around a tiny, tightly-focused lens in
    // a compact housing, noticeably smaller than a wash or general
    // moving spot.
    movingBeam:{
      body:new THREE.BoxGeometry(.65,.4,.65),
      yoke:new THREE.BoxGeometry(.08,.55,.08),
      head:new THREE.CylinderGeometry(.2,.22,.55,12),
      bulb:new THREE.SphereGeometry(.12,6,6)
    },

    fresnel:{
      body:new THREE.CylinderGeometry(.5,.55,.85,12),
      yoke:new THREE.BoxGeometry(.1,.55,.1),
      head:new THREE.CylinderGeometry(.42,.42,.14,12),
      bulb:new THREE.SphereGeometry(.22,6,6)
    },

    parCan:{
      body:new THREE.CylinderGeometry(.42,.46,.55,12),
      yoke:new THREE.BoxGeometry(.08,.4,.08),
      head:new THREE.CylinderGeometry(.38,.38,.07,12),
      bulb:new THREE.SphereGeometry(.2,6,6)
    },

    strobe:{
      body:new THREE.BoxGeometry(1.5,.45,.5),
      yoke:new THREE.BoxGeometry(.1,.32,.1),
      head:new THREE.BoxGeometry(1.3,.28,.12),
      bulb:new THREE.BoxGeometry(1.1,.12,.12)
    },

    // A long, thin batten — no separate yoke/head silhouette worth
    // modelling (it's static, see hasDMXPanTilt in makeFixture), so
    // "head" is just a thin mounting plate behind the actual light-
    // emitting face. The bulb geometry is pre-rotated (rotateX) so its
    // PlaneGeometry — needed for makeLightBarCellTexture's per-cell
    // emissive map to actually show a row of cells rather than one dot —
    // faces straight down (-Y, the same direction every archetype's beam
    // points, see the AIM TARGET section of updateFixtures) instead of
    // a plane's own default +Z, since nothing in the shared bulb-mesh
    // setup in makeFixture applies any per-archetype rotation of its own.
    staticBar:{
      body:new THREE.BoxGeometry(2.2,.18,.18),
      yoke:new THREE.BoxGeometry(.1,.3,.1),
      head:new THREE.BoxGeometry(2,.1,.12),
      bulb:new THREE.PlaneGeometry(1.95,.14).rotateX(Math.PI/2)
    },

    // A compact frame holding a grid of separate lamps (see
    // makeBlinderLampTexture) rather than one continuous glowing panel —
    // same static, no-yoke-worth-modelling reasoning and the same
    // pre-rotated PlaneGeometry bulb as staticBar above.
    blinder:{
      body:new THREE.BoxGeometry(1.4,.9,.35),
      yoke:new THREE.BoxGeometry(.12,.5,.12),
      head:new THREE.BoxGeometry(1.3,.8,.1),
      bulb:new THREE.PlaneGeometry(1.2,.72).rotateX(Math.PI/2)
    }

  };


  const material = (color,metalness,roughness) =>
    new THREE.MeshStandardMaterial({
      color, metalness, roughness,
      envMap:S.envMap,
      envMapIntensity:.5
    });


  S.fixtureMaterial = {

    movingHead:{
      body:material(0x262626,.8,.3),
      yoke:material(0x0d0d0d,.8,.3),
      head:material(0x595959,.9,.1)
    },

    movingWash:{
      body:material(0x2a2a2a,.8,.3),
      yoke:material(0x0d0d0d,.8,.3),
      head:material(0x4a4a4a,.85,.15)
    },

    movingBeam:{
      body:material(0x1e1e1e,.85,.25),
      yoke:material(0x0d0d0d,.85,.25),
      head:material(0x3a3a3a,.9,.1)
    },

    fresnel:{
      body:material(0x2b2b2b,.55,.4),
      yoke:material(0x121212,.6,.4),
      head:material(0x1a1a1a,.4,.55)
    },

    parCan:{
      body:material(0x1f1f1f,.7,.35),
      yoke:material(0x0d0d0d,.7,.35),
      head:material(0x151515,.35,.6)
    },

    strobe:{
      body:material(0x161616,.75,.3),
      yoke:material(0x0d0d0d,.75,.3),
      head:material(0xd8d8d8,.2,.4)
    },

    staticBar:{
      body:material(0x1a1a1a,.7,.35),
      yoke:material(0x0d0d0d,.7,.35),
      head:material(0x101010,.6,.4)
    },

    blinder:{
      body:material(0x1a1a1a,.6,.4),
      yoke:material(0x0d0d0d,.6,.4),
      head:material(0x101010,.5,.45)
    }

  };


  S.fixtureBulbMaterial =
    new THREE.MeshStandardMaterial({
      color:0x080808,
      emissive:0x000000,
      emissiveIntensity:0
    });

  // Per-cell/per-lamp emissive maps for the two archetypes whose bulb is
  // meant to read as several separate light-emitting segments rather
  // than one continuous glow (see makeFixture's BULB section, which
  // clones S.fixtureBulbMaterial and assigns one of these onto the clone
  // when the archetype calls for it) — see the LIGHT BAR CELL TEXTURE /
  // BLINDER LAMP TEXTURE comments above for why this is a texture rather
  // than genuinely separate per-cell DMX control.
  S.staticBarEmissiveMap =
    makeLightBarCellTexture();

  S.blinderEmissiveMap =
    makeBlinderLampTexture();


  S.floorSpotGeometry =
    new THREE.CircleGeometry(1, 24);

  S.floorSpotTexture =
    makeFloorSpotTexture();

  // One shared unit-cone point cloud, reused by every fixture's dust
  // motes (see DUST MOTES in makeFixture) — same shared-geometry/
  // per-instance-material split as the floor spot and fixture bulbs.
  // Authored in the SAME local coordinate convention as the haze
  // cone's own CylinderGeometry (y from -5 to +5) so it can be added
  // as a direct CHILD of each fixture's haze mesh: it then inherits
  // haze's position and — critically — haze's scale automatically, so
  // the mote spread stays in sync with zoom/iris changes (see the
  // ZOOM/IRIS section of updateFixtures) for free, no extra per-frame
  // code needed.
  S.dustMoteGeometry =
    makeDustMoteGeometry(36);


  // ----------------------------------------------------------
  // BEAM SHADOWS — a small fixed pool (MAX_SHADOW_LIGHTS) of dedicated
  // depth-only render targets/cameras, one per fixture currently holding
  // a shadow slot (see updateBeamShadows). Rendered independently of
  // three.js's own automatic shadow maps (spot.shadow.map/camera) so we
  // can freely control exactly what counts as an occluder (via layers,
  // see S.camera.layers.enable(1) above and haze/dustMotes/floorSpot's
  // layer 1 in makeFixture) without touching the real spotlight shadow
  // three.js already manages for the floor/truss shadows.
  // ----------------------------------------------------------

  S.beamShadowSize = 256;

  S.beamShadowBiasMatrix =
    new THREE.Matrix4().set(
      .5,0,0,.5,
      0,.5,0,.5,
      0,0,.5,.5,
      0,0,0,1
    );

  // MeshDepthMaterial as scene.overrideMaterial — Points (dustMotes) and
  // the additive haze/floorSpot meshes never reach it: they're on layer 1
  // and every beam-shadow camera defaults to layer 0 only (see
  // updateBeamShadows), so this only ever renders solid geometry (fixture
  // bodies, truss, floor, stage, seats) into the depth texture.
  // RGBADepthPacking — see the comment on S.beamShadowRTs above for why
  // this writes depth into the render target's ordinary colour output
  // instead of relying on a native DepthTexture.
  S.beamShadowDepthMaterial =
    new THREE.MeshDepthMaterial({
      depthPacking: THREE.RGBADepthPacking
    });

  S.beamShadowRTs = [];
  S.beamShadowCameras = [];

  for(let i=0;i<MAX_SHADOW_LIGHTS;i++){

    // A plain RGBA colour target, not a native DepthTexture render
    // target — verified empirically (via a throwaway debug shader while
    // building this) that this WebGL/driver combination does not
    // reliably expose a THREE.DepthTexture's contents through a manual
    // sampler2D read in a custom shader (it consistently reads back as
    // the empty/far-plane value regardless of what was actually
    // rendered), even though the exact same camera/scene/override-
    // material setup renders correct, varying depth once packed into an
    // ordinary RGBA colour texture. MeshDepthMaterial's RGBADepthPacking
    // (see S.beamShadowDepthMaterial) writes depth into colour instead,
    // and hazeMaterial's fragment shader unpacks it back out (the same
    // technique three.js's own shadow map fallback path uses).
    S.beamShadowRTs.push(
      new THREE.WebGLRenderTarget(
        S.beamShadowSize,
        S.beamShadowSize
      )
    );

    // near/far/fov are rewritten per-frame in updateBeamShadows to match
    // that slot's current fixture; the values here are just placeholders
    // so the camera is valid before the first assignment.
    S.beamShadowCameras.push(
      new THREE.PerspectiveCamera(50,1,.3,60)
    );

  }

}


function makeDustMoteGeometry(count){

  const positions =
    new Float32Array(count*3);

  // One random phase per point (see dustMoteMaterial's vertex shader) so
  // each mote drifts on its own independent cycle instead of the whole
  // cloud pulsing in lockstep — real haze motes wander individually, not
  // as a single rigid pattern that only ever rescales with zoom.
  const seeds =
    new Float32Array(count);

  for(let i=0;i<count;i++){

    // t=0 at local y=-5 (which the haze mesh's position.set(0,-5,0)
    // shift maps to tiltGroup y=-10, the FAR end — radiusBottom,
    // hazeTopRadius, wide), t=1 at local y=+5 (maps to tiltGroup y=0,
    // the BULB end — radiusTop, the fixed .18, narrow). Must stay the
    // opposite way round from what it looks like at a glance: the
    // cone's own radiusTop/radiusBottom naming is about local +Y/-Y,
    // not "near the fixture" vs "far away" — see the comment on the
    // haze CylinderGeometry call above for why the real beam is
    // narrow at the bulb and widens with distance. The exact radius
    // ratio here doesn't need to match hazeTopRadius/.18 precisely —
    // motes are a loose ambient detail, not a surface to hug — a
    // generic taper scaled per-fixture by hazeTopRadius (see
    // makeFixture) already looks right.
    const t = Math.random();

    const y =
      THREE.MathUtils.lerp(-5,5,t);

    const radiusAtY =
      THREE.MathUtils.lerp(1,.05,t);

    // sqrt() so points land with uniform density across the disk's
    // AREA at each height, instead of clumping toward the centre.
    const r =
      Math.sqrt(Math.random()) * radiusAtY;

    const angle =
      Math.random() * Math.PI * 2;

    positions[i*3]   = Math.cos(angle)*r;
    positions[i*3+1] = y;
    positions[i*3+2] = Math.sin(angle)*r;

    seeds[i] = Math.random();

  }

  const geometry =
    new THREE.BufferGeometry();

  geometry.setAttribute(
    "position",
    new THREE.BufferAttribute(positions,3)
  );

  geometry.setAttribute(
    "seed",
    new THREE.BufferAttribute(seeds,1)
  );

  return geometry;

}

// ============================================================
// FIXTURE DEFINITION CACHE
// ============================================================

function getFixtureDefinition(fx){

  if(!fx)
    return null;

  if(fx.map && typeof fx.map === "object")
    return fx;

  if(fx.definition && typeof fx.definition === "object")
    return fx.definition;

  if(fx.fixture && typeof fx.fixture === "object")
    return fx.fixture;

  const name =
    fx.name ??
    fx.fixtureName ??
    fx.type ??
    fx.model;

  if(!name)
    return null;

  if(S.fixtureCache.has(name))
    return S.fixtureCache.get(name);

  if(S.library[name]){

    const result =
      S.library[name];

    S.fixtureCache.set(
      name,
      result
    );

    return result;

  }

  const lowerName =
    String(name).toLowerCase();

  const keys =
    Object.keys(S.library);

  let result = null;

  for(let i=0;i<keys.length;i++){

    if(
      keys[i].toLowerCase() ===
      lowerName
    ){

      result =
        S.library[keys[i]];

      break;

    }

  }

  S.fixtureCache.set(
    name,
    result
  );

  return result;

}


// ============================================================
// ADDRESS
// ============================================================

// Global 0-based index into S.dmx, which now spans every patch universe
// end-to-end (see the DMX_TOTAL_CHANNELS comment near MAX_REAL_LIGHTS) —
// folds the fixture's patch universe (fixture.uni, 1-10) into the offset
// the same way js/dmx.js's own getFixtureBaseAddress does, so this stays
// in sync with the buffer the console actually sends.
function address(fx){

  const n = Number(
    fx?.addr ??
    fx?.address ??
    fx?.startAddress ??
    fx?.start ??
    fx?.channel
  );

  if(
    !Number.isFinite(n) ||
    n < 1 ||
    n > DMX_CHANNELS
  )
    return -1;

  const uniRaw = Number(fx?.uni ?? fx?.universe ?? 1);

  const uni =
    Number.isInteger(uniRaw) &&
    uniRaw >= 1 &&
    uniRaw <= MAX_UNIVERSES
      ? uniRaw
      : 1;

  return (uni-1)*DMX_CHANNELS + (n-1);

}


// ============================================================
// SHADOW SETTINGS
// ============================================================

// mapSize defaults to 64 — fine for the 4 diffuse work lights this was
// originally written for, where blocky shadows are never the focus.
// Moving-head beam shadows (see MAX_SHADOW_LIGHTS) pass a sharper size
// since at most 3 of those exist at once and a beam's shadow — a truss
// bar or a person breaking a hard-edged spotlight — is meant to actually
// read as a shape, not a smudge.
function shadow(light,mapSize=64){

  light.castShadow = true;

  light.shadow.mapSize.set(
    mapSize,
    mapSize
  );

  light.shadow.camera.near = .1;
  light.shadow.camera.far = 55;

  light.shadow.bias = -.0002;
  light.shadow.normalBias = .02;

  light.shadow.radius = 1;

}


// ============================================================
// FLOOR SPOT TEXTURE
// ============================================================

// One shared soft radial-gradient texture for every fixture's floor landing
// spot (see the MAX_REAL_LIGHTS comment above and S.groundMeshes in
// theatre()) — generated once and reused via a per-fixture MeshBasicMaterial
// (own instance so each can have its own colour/opacity), the same
// shared-geometry/per-instance-material split already used for bulbs
// elsewhere in this file.
function makeFloorSpotTexture(){

  const size = 128;

  const canvas =
    document.createElement("canvas");

  canvas.width = size;
  canvas.height = size;

  const ctx = canvas.getContext("2d");

  const gradient =
    ctx.createRadialGradient(
      size/2, size/2, 0,
      size/2, size/2, size/2
    );

  gradient.addColorStop(0, "rgba(255,255,255,1)");
  gradient.addColorStop(.4, "rgba(255,255,255,.5)");
  gradient.addColorStop(1, "rgba(255,255,255,0)");

  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, size, size);

  return new THREE.CanvasTexture(canvas);

}


// ============================================================
// DISCO BALL TILE TEXTURE
// ============================================================

// A real mirror ball's surface reads as a visible GRID of small square
// tiles with dark grout lines between them, not a perfectly continuous
// mirror finish or a faceted "gem." Used as both the disco ball's colour
// map (so the grid itself is visible, not just implied by shading) and
// its bumpMap (a little physical depth at each seam) on a plain smooth
// SphereGeometry — genuine flat facets (an earlier version of this ball
// used a fine Icosahedron) gave a sparkly gem-like look under a single
// close, bright spotlight, but under normal room/ambient lighting just
// looked like a shiny bowling ball with no visible tile pattern at all,
// which isn't the recognisable "mirror ball" read this is going for.
function makeDiscoBallTileTexture(){

  const size = 512;

  const canvas =
    document.createElement("canvas");

  canvas.width = size;
  canvas.height = size;

  const ctx = canvas.getContext("2d");

  // Dark base colour shows through the 1px gaps left between tiles below
  // — cheaper than a separate stroke pass, and reads as proper grout.
  ctx.fillStyle = "rgb(70,70,70)";
  ctx.fillRect(0, 0, size, size);

  const cells = 24;
  const cellSize = size/cells;

  for(let y=0;y<cells;y++){

    for(let x=0;x<cells;x++){

      // Subtle random shade per tile — real mirror tiles are never
      // perfectly flush or identically angled, which is why they don't
      // all reflect as one single flat mirror.
      const shade =
        200+Math.random()*40;

      ctx.fillStyle =
        `rgb(${shade},${shade},${shade})`;

      ctx.fillRect(
        x*cellSize+1,
        y*cellSize+1,
        cellSize-2,
        cellSize-2
      );

    }

  }

  const texture =
    new THREE.CanvasTexture(canvas);

  texture.wrapS = THREE.RepeatWrapping;
  texture.wrapT = THREE.RepeatWrapping;

  // Repeats the 24x24 tile grid several times around the sphere's own UV
  // wrap (U = around the equator, V = pole to pole) instead of stretching
  // one copy over the whole ball, which would make the tiles nearer the
  // poles look huge and distorted compared to the equator.
  texture.repeat.set(6,3);

  return texture;

}


// ============================================================
// LIGHT BAR CELL TEXTURE
// ============================================================

// An emissive map for the staticBar archetype's bulb (see
// createSharedFixtureResources) — a row of individual rounded-rect
// "cells" along a strip, rather than one solid glowing bar. This
// fixture's DMX map has no true per-cell channels (see the LIGHT BAR
// comment in js/fixtures.js for why), so every cell always shows the
// SAME colour/intensity — this texture exists purely so a lit bar reads
// as "a batten made of several LED segments," which is what the real
// fixture looks like, rather than a single featureless glowing plank.
function makeLightBarCellTexture(){

  const width = 512;
  const height = 64;

  const canvas =
    document.createElement("canvas");

  canvas.width = width;
  canvas.height = height;

  const ctx = canvas.getContext("2d");

  const cells = 8;
  const gap = 10;
  const cellWidth =
    (width-gap*(cells+1))/cells;

  ctx.fillStyle = "#fff";

  for(let i=0;i<cells;i++){

    const x =
      gap+i*(cellWidth+gap);

    const radius =
      Math.min(cellWidth,height-16)/2;

    ctx.beginPath();
    ctx.roundRect(
      x, 8,
      cellWidth, height-16,
      radius
    );
    ctx.fill();

  }

  return new THREE.CanvasTexture(canvas);

}


// ============================================================
// BLINDER LAMP TEXTURE
// ============================================================

// An emissive map for the blinder archetype's bulb — a real audience
// blinder is a small grid of separate par-style lamps in one frame, not
// one continuous glowing panel; same one-colour-for-the-whole-fixture
// reasoning as makeLightBarCellTexture above (see the BLINDER comment in
// js/fixtures.js), just arranged as a grid instead of a single row.
function makeBlinderLampTexture(){

  const size = 256;

  const canvas =
    document.createElement("canvas");

  canvas.width = size;
  canvas.height = size;

  const ctx = canvas.getContext("2d");

  const cols = 4;
  const rows = 2;

  const gapX = size/cols*.22;
  const gapY = size/rows*.28;

  const cellWidth = size/cols-gapX;
  const cellHeight = size/rows-gapY;

  const lampRadius =
    Math.min(cellWidth,cellHeight)/2;

  ctx.fillStyle = "#fff";

  for(let row=0;row<rows;row++){

    for(let col=0;col<cols;col++){

      const cx =
        (col+.5)*(size/cols);

      const cy =
        (row+.5)*(size/rows);

      ctx.beginPath();
      ctx.arc(cx,cy,lampRadius,0,Math.PI*2);
      ctx.fill();

    }

  }

  return new THREE.CanvasTexture(canvas);

}


// ============================================================
// FIBONACCI SPHERE DIRECTIONS
// ============================================================

// n unit vectors spread evenly over a sphere — used for S.discoBall's
// candidate facet directions (see theatre()) so the ones that end up
// facing the key light aren't visibly clustered or banded the way a
// plain latitude/longitude grid of directions would be.
function fibonacciSphereDirections(n){

  const directions = [];

  const goldenAngle =
    Math.PI*(3-Math.sqrt(5));

  for(let i=0;i<n;i++){

    const y =
      1-(i/(n-1))*2;

    const radiusAtY =
      Math.sqrt(1-y*y);

    const theta =
      goldenAngle*i;

    directions.push(
      new THREE.Vector3(
        Math.cos(theta)*radiusAtY,
        y,
        Math.sin(theta)*radiusAtY
      )
    );

  }

  return directions;

}


// ============================================================
// HAZE MATERIAL
// ============================================================

function hazeMaterial(){

  return new THREE.ShaderMaterial({

    uniforms:{

      color:{
        value:new THREE.Color(1,1,1)
      },

      opacity:{
        value:0
      },

      time:{
        value:0
      },

      // Real "haze shadow" support (see updateBeamShadows) — only the
      // MAX_SHADOW_LIGHTS-budgeted fixtures ever get useShadow flipped to
      // 1 with a real per-fixture depth texture/matrix; every other
      // fixture's haze renders exactly as before (branch never taken).
      // beamShadowMap defaults to slot 0's texture (always valid once
      // createSharedFixtureResources runs) purely so the sampler is never
      // bound to a null/incomplete texture — useShadow gates whether it's
      // actually sampled.
      useShadow:{
        value:0
      },

      beamShadowMap:{
        value:S.beamShadowRTs[0].texture
      },

      beamShadowMatrix:{
        value:new THREE.Matrix4()
      }

    },

    vertexShader:`

      varying vec2 vUv;
      varying vec3 vWorldPosition;

      void main(){

        vUv = uv;

        vec4 worldPosition =
          modelMatrix *
          vec4(position,1.0);

        vWorldPosition =
          worldPosition.xyz;

        gl_Position =
          projectionMatrix *
          modelViewMatrix *
          vec4(position,1.0);

      }

    `,

    fragmentShader:`

      uniform vec3 color;
      uniform float opacity;
      uniform float time;

      uniform float useShadow;
      uniform sampler2D beamShadowMap;
      uniform mat4 beamShadowMatrix;

      varying vec2 vUv;
      varying vec3 vWorldPosition;

      // beamShadowMap stores depth packed into RGBA colour (see
      // S.beamShadowRTs/S.beamShadowDepthMaterial) rather than a native
      // depth texture — reconstructs the same float this was packed
      // from. Identical formula to three.js's own internal
      // unpackRGBAToDepth (packing.glsl.js), reproduced here since this
      // material doesn't pull in that shader chunk.
      float unpackRGBAToDepth(vec4 v){

        const vec4 unpackFactors =
          (255.0/256.0) /
          vec4(16777216.0, 65536.0, 256.0, 1.0);

        return dot(v, unpackFactors);

      }

      // Cheap 4-tap PCF — softens the occluder edge into a gradient
      // instead of a single hard-edged dark band, closer to how a real
      // shadow reads inside visible haze. Only ever runs for the handful
      // of fixtures holding a shadow slot.
      float beamShadowSample(vec3 coord){

        float texel = 1.0/256.0;

        float occluded = 0.0;

        occluded += unpackRGBAToDepth(texture2D(beamShadowMap, coord.xy + vec2(-texel,-texel))) < coord.z-.0015 ? 1.0 : 0.0;
        occluded += unpackRGBAToDepth(texture2D(beamShadowMap, coord.xy + vec2( texel,-texel))) < coord.z-.0015 ? 1.0 : 0.0;
        occluded += unpackRGBAToDepth(texture2D(beamShadowMap, coord.xy + vec2(-texel, texel))) < coord.z-.0015 ? 1.0 : 0.0;
        occluded += unpackRGBAToDepth(texture2D(beamShadowMap, coord.xy + vec2( texel, texel))) < coord.z-.0015 ? 1.0 : 0.0;

        return occluded*.25;

      }

      void main(){

        float edge =
          1.0 -
          smoothstep(
            .05,
            .5,
            abs(vUv.x-.5)*2.0
          );

        float fade =
          smoothstep(0.0,.12,vUv.y) *
          smoothstep(1.0,.55,vUv.y);

        float pulse =
          .94 +
          sin(vUv.y*20.0 + time*.5)*.03;

        // Dark void where a real object (truss, another fixture, a
        // person) sits between the bulb and this point on the beam —
        // sampled from a depth-only render of the scene taken from the
        // light's own point of view (updateBeamShadows), completely
        // separate from three.js's own floor/truss shadow map.
        float shadowFactor = 1.0;

        if(useShadow > .5){

          vec4 shadowCoord =
            beamShadowMatrix *
            vec4(vWorldPosition,1.0);

          shadowCoord.xyz /= shadowCoord.w;

          if(
            shadowCoord.x >= 0.0 && shadowCoord.x <= 1.0 &&
            shadowCoord.y >= 0.0 && shadowCoord.y <= 1.0 &&
            shadowCoord.z >= 0.0 && shadowCoord.z <= 1.0
          ){

            float occlusion =
              beamShadowSample(shadowCoord.xyz);

            // Never fully black — a real haze shadow is a dim void, not
            // an absolute absence of scattered light.
            shadowFactor =
              mix(1.0, .1, occlusion);

          }

        }

        gl_FragColor =
          vec4(
            color,
            edge *
            fade *
            opacity *
            pulse *
            shadowFactor
          );

      }

    `,

    transparent:true,
    depthWrite:false,
    depthTest:true,

    blending:THREE.AdditiveBlending,

    side:THREE.DoubleSide

  });

}


// ============================================================
// DUST MOTE MATERIAL
// ============================================================

// hazeUniforms is THIS fixture's haze mesh's own uniforms object (see
// hazeMaterial above) — time/useShadow/beamShadowMap/beamShadowMatrix are
// taken as the SAME uniform objects, not copies, specifically so this
// material automatically tracks whatever haze is doing every frame with
// no extra per-frame code anywhere else: updateBeamShadows() only ever
// writes to o.haze.material.uniforms, and because dust motes hold a
// reference to those exact same {value} objects, a mote sitting in the
// dark gap a real occluder casts into the beam (see updateBeamShadows)
// dims right along with the haze around it instead of floating there
// fully lit — light that isn't reaching that point can't be scattering
// off dust there either. Previously a plain THREE.PointsMaterial, which
// has no way to hook in either that shadow test or per-point animation;
// this needs a custom shader for both.
function dustMoteMaterial(hazeUniforms){

  return new THREE.ShaderMaterial({

    uniforms:{

      color:{
        value:new THREE.Color(1,1,1)
      },

      opacity:{
        value:0
      },

      map:{
        value:S.floorSpotTexture
      },

      // Matches THREE.PointsMaterial's own sizeAttenuation scale exactly
      // (drawing-buffer height * .5 — see refreshUniformsPoints in
      // three.js's WebGLRenderer) rather than a guessed constant, so
      // motes come out the same physical size on a high-DPI display as
      // they did before this material switch instead of shrinking
      // toward invisible. Captured once at fixture-creation time; this
      // file has no window-resize handling anywhere else either, so
      // that's consistent with how everything else here already behaves.
      pointScale:{
        value:
          S.renderer
            .getDrawingBufferSize(new THREE.Vector2())
            .height * .5
      },

      time:hazeUniforms.time,
      useShadow:hazeUniforms.useShadow,
      beamShadowMap:hazeUniforms.beamShadowMap,
      beamShadowMatrix:hazeUniforms.beamShadowMatrix

    },

    vertexShader:`

      attribute float seed;

      uniform float time;
      uniform float pointScale;

      varying vec3 vWorldPosition;

      void main(){

        // Gentle, bounded per-point wander — each mote's own seed offsets
        // its phase so the cloud drifts as loose independent specks
        // instead of one rigid pattern breathing in and out together.
        // Amplitude is small relative to the cone's own local unit scale
        // (radius 1 at its wide end) so motes wander near their slot
        // rather than drifting out of the beam's visible shape.
        vec3 drifted =
          position +
          vec3(
            sin(time*.6 + seed*6.2831853)*.15,
            cos(time*.4 + seed*6.2831853*1.7)*.1,
            sin(time*.5 + seed*6.2831853*2.3)*.15
          );

        vec4 worldPosition =
          modelMatrix *
          vec4(drifted,1.0);

        vWorldPosition =
          worldPosition.xyz;

        vec4 mvPosition =
          modelViewMatrix *
          vec4(drifted,1.0);

        gl_Position =
          projectionMatrix *
          mvPosition;

        gl_PointSize = .09 * (pointScale / -mvPosition.z);

      }

    `,

    fragmentShader:`

      uniform vec3 color;
      uniform float opacity;
      uniform sampler2D map;

      uniform float useShadow;
      uniform sampler2D beamShadowMap;
      uniform mat4 beamShadowMatrix;

      varying vec3 vWorldPosition;

      // Same packing as hazeMaterial's beamShadowMap (see the comment on
      // S.beamShadowRTs) — duplicated rather than shared as a GLSL
      // #include since these are two independent ShaderMaterial sources;
      // the cost is trivial (a handful of points, only for fixtures
      // already holding a shadow slot).
      float unpackRGBAToDepth(vec4 v){

        const vec4 unpackFactors =
          (255.0/256.0) /
          vec4(16777216.0, 65536.0, 256.0, 1.0);

        return dot(v, unpackFactors);

      }

      void main(){

        vec4 texColor =
          texture2D(map, gl_PointCoord);

        float shadowFactor = 1.0;

        if(useShadow > .5){

          vec4 shadowCoord =
            beamShadowMatrix *
            vec4(vWorldPosition,1.0);

          shadowCoord.xyz /= shadowCoord.w;

          if(
            shadowCoord.x >= 0.0 && shadowCoord.x <= 1.0 &&
            shadowCoord.y >= 0.0 && shadowCoord.y <= 1.0 &&
            shadowCoord.z >= 0.0 && shadowCoord.z <= 1.0
          ){

            float occluderDepth =
              unpackRGBAToDepth(
                texture2D(beamShadowMap, shadowCoord.xy)
              );

            if(occluderDepth < shadowCoord.z - .0015)
              shadowFactor = .1;

          }

        }

        gl_FragColor =
          vec4(color,1.0) *
          texColor *
          opacity *
          shadowFactor;

      }

    `,

    transparent:true,
    depthWrite:false,

    blending:THREE.AdditiveBlending

  });

}


// ============================================================
// MAKE FIXTURE
// ============================================================

function makeFixture(fx,index){

  const count =
    Math.max(
      S.fixtures.length,
      1
    );

  const mount =
    new THREE.Group();

  let pos;

  if(S.fixturePositions.has(index)){

    const v =
      S.fixturePositions.get(index);

    pos = {
      x:v.x,
      y:v.y,
      z:v.z
    };

  }else{

    pos = {
      x:(index-(count-1)/2)*2.4,
      y:9.5,
      z:-2
    };

  }

  mount.position.set(
    pos.x,
    pos.y,
    pos.z
  );

  mount.userData.fx = fx;
  mount.userData.posKey = index;

  S.scene.add(mount);


  // ----------------------------------------------------------
  // DMX / PHOTOMETRICS (resolved early — the rig below is built
  // differently depending on fixture type and real beam specs)
  // ----------------------------------------------------------

  const def =
    getFixtureDefinition(fx);

  const map =
    def?.map;

  const photo =
    def?.photometrics || {};

  const hasDMXPanTilt =
    !!(
      map &&
      typeof map.pan === "number" &&
      typeof map.tilt === "number"
    );

  const archetype =
    fixtureArchetype(def,hasDMXPanTilt);

  const geo =
    S.fixtureGeometry[archetype];

  const mat =
    S.fixtureMaterial[archetype];

  const layout =
    ARCHETYPE_LAYOUT[archetype];

  const hasZoomChannel =
    typeof map?.zoom === "number";

  // Real "beam angle" specs are FULL cone angles in degrees.
  // Fixtures without published photometrics fall back to the
  // original generic constants so nothing regresses visually.
  const zoomMinRad =
    hasZoomChannel
      ? degToHalfAngleRad(
          photo.beamAngleMin ??
          photo.beamAngle ??
          22
        )
      : null;

  const zoomMaxRad =
    hasZoomChannel
      ? degToHalfAngleRad(
          photo.beamAngleMax ??
          (photo.beamAngle ? photo.beamAngle*6 : 132)
        )
      : null;

  const staticAngleRad =
    !hasZoomChannel && typeof photo.beamAngle === "number"
      ? degToHalfAngleRad(photo.beamAngle)
      : Math.PI*.32;

  const outputScale =
    typeof photo.outputScale === "number"
      ? photo.outputScale
      : 1;

  // Only tint the plain dimmer/tungsten "no RGB channel" white
  // fallback — colour-mixing fixtures already derive real colour
  // from their own channels.
  const colourTemp =
    typeof photo.colourTemperature === "number"
      ? kelvinToRGB(photo.colourTemperature)
      : null;


  // ----------------------------------------------------------
  // FRAMING SHUTTERS + GOBO — only fixtures whose map actually
  // defines shutter and/or gobo channels get a mask canvas/
  // texture at all. Both are drawn into the SAME texture (gobo
  // pattern as the base, shutter blades cut on top of it).
  // ----------------------------------------------------------

  const hasShutters =
    [1,2,3,4].some(n =>
      typeof map?.[`shutter${n}Insert`] === "number" ||
      typeof map?.[`shutter${n}Rotate`] === "number" ||
      typeof map?.[`shutter${n}AngleA`] === "number" ||
      typeof map?.[`shutter${n}AngleB`] === "number"
    );

  const hasGobo =
    typeof map?.gobo === "number";

  const hasGobo2 =
    typeof map?.gobo2 === "number";

  const hasPrism =
    typeof map?.prism === "number";

  // MANUAL BARN DOORS — not a DMX channel at all. Real fresnels
  // and PAR cans commonly carry a physical 4-way barn door frame
  // that's shaped by hand at the fixture rather than over DMX;
  // fixtures that already have real DMX-driven framing shutters,
  // or that pan/tilt, or that are strobes, don't get this (those
  // either already shape their beam over DMX or don't carry barn
  // doors in real life).
  const hasManualShutters =
    !hasShutters &&
    (archetype === "fresnel" || archetype === "parCan");

  let shutterCanvas = null;
  let shutterCtx = null;
  let shutterTexture = null;

  if(hasShutters || hasGobo || hasGobo2 || hasPrism || hasManualShutters){

    shutterCanvas =
      document.createElement("canvas");

    shutterCanvas.width = 256;
    shutterCanvas.height = 256;

    shutterCtx =
      shutterCanvas.getContext("2d");

    shutterTexture =
      new THREE.CanvasTexture(shutterCanvas);

    shutterTexture.colorSpace =
      THREE.NoColorSpace;

  }


  // ----------------------------------------------------------
  // BODY
  // ----------------------------------------------------------

  const body =
    new THREE.Mesh(
      geo.body,
      mat.body
    );

  // Fixture shadows are unnecessary.
  // Work lights are the only shadow-casting lights.
  body.castShadow = false;
  body.receiveShadow = false;

  body.userData.isFixtureBody = true;
  body.userData.mountRef = mount;

  mount.add(body);


  // ----------------------------------------------------------
  // PAN
  // ----------------------------------------------------------

  const panGroup =
    new THREE.Group();

  panGroup.position.set(
    0,
    -.3,
    0
  );

  mount.add(panGroup);


  const yokeLeft =
    new THREE.Mesh(
      geo.yoke,
      mat.yoke
    );

  yokeLeft.position.set(
    -layout.yokeOffsetX,
    layout.yokeY,
    0
  );

  yokeLeft.castShadow = false;
  yokeLeft.receiveShadow = false;

  panGroup.add(yokeLeft);


  const yokeRight =
    new THREE.Mesh(
      geo.yoke,
      mat.yoke
    );

  yokeRight.position.set(
    layout.yokeOffsetX,
    layout.yokeY,
    0
  );

  yokeRight.castShadow = false;
  yokeRight.receiveShadow = false;

  panGroup.add(yokeRight);


  // ----------------------------------------------------------
  // TILT
  // ----------------------------------------------------------

  const tiltGroup =
    new THREE.Group();

  tiltGroup.position.set(
    0,
    layout.tiltGroupY,
    0
  );

  panGroup.add(tiltGroup);


  // ----------------------------------------------------------
  // HEAD
  // ----------------------------------------------------------

  const head =
    new THREE.Mesh(
      geo.head,
      mat.head
    );

  head.castShadow = false;
  head.receiveShadow = false;

  head.userData.isAimHandle = true;

  tiltGroup.add(head);


  // ----------------------------------------------------------
  // BULB
  // ----------------------------------------------------------

  const bulbMaterial =
    S.fixtureBulbMaterial.clone();

  // staticBar/blinder's bulb is a flat PlaneGeometry (see
  // createSharedFixtureResources) so their per-cell/per-lamp textures
  // actually show multiple segments instead of one dot — emissiveMap
  // multiplies into whatever colour/intensity the per-frame DMX-driven
  // emissive is (see the BULB section of updateFixtures), so the cells
  // still tint and dim together with the rest of this fixture's output.
  // DoubleSide since a flat plane is otherwise invisible from behind —
  // this fixture gets viewed from plenty of angles other than straight
  // down its own beam axis in a 3D scene.
  if(archetype === "staticBar"){

    bulbMaterial.emissiveMap = S.staticBarEmissiveMap;
    bulbMaterial.side = THREE.DoubleSide;

  }else if(archetype === "blinder"){

    bulbMaterial.emissiveMap = S.blinderEmissiveMap;
    bulbMaterial.side = THREE.DoubleSide;

  }

  const bulb =
    new THREE.Mesh(
      geo.bulb,
      bulbMaterial
    );

  bulb.castShadow = false;
  bulb.receiveShadow = false;

  bulb.position.set(
    0,
    layout.bulbY,
    0
  );

  tiltGroup.add(bulb);


  // ----------------------------------------------------------
  // TARGET
  // ----------------------------------------------------------

  const target =
    new THREE.Object3D();

  S.scene.add(target);


  // ----------------------------------------------------------
  // FLOOR SPOT — see the MAX_REAL_LIGHTS comment near the top and
  // S.groundMeshes in theatre(). World-space like target above (not
  // parented under the fixture), since its position is the beam's
  // ground INTERSECTION point, not something that moves rigidly
  // with the fixture body.
  // ----------------------------------------------------------

  const floorSpot =
    new THREE.Mesh(
      S.floorSpotGeometry,
      new THREE.MeshBasicMaterial({
        map:S.floorSpotTexture,
        color:0xffffff,
        transparent:true,
        opacity:0,
        depthWrite:false,
        blending:THREE.AdditiveBlending,
        side:THREE.DoubleSide
      })
    );

  floorSpot.rotation.x = -Math.PI/2;

  floorSpot.visible = false;

  // Layer 1 — see S.camera.layers.enable(1) and updateBeamShadows: this
  // additive decal must stay visible to the main camera but invisible to
  // the beam-shadow depth cameras (which only see layer 0, real solid
  // occluders), or it would incorrectly cast a "shadow" of itself.
  floorSpot.layers.set(1);

  S.scene.add(floorSpot);


  // ----------------------------------------------------------
  // SPOT LIGHT
  // ----------------------------------------------------------

  const spot =
    new THREE.SpotLight(
      0xffffff,
      0,
      45,
      hasZoomChannel
        ? (zoomMinRad+zoomMaxRad)/2
        : staticAngleRad,
      .72,
      1
    );

  spot.position.set(
    0,
    layout.bulbY,
    0
  );

  spot.target = target;

  // Configures shadow.mapSize/camera/bias but ALSO forces castShadow
  // true — only a few fixtures (MAX_SHADOW_LIGHTS) actually get to cast
  // a shadow at any moment, decided per-frame in updateFixtures, so it's
  // turned back off immediately here. Every fixture still gets the
  // camera/bias/map-size setup done once at creation rather than paying
  // for it on whichever frame it happens to enter the shadow budget.
  shadow(spot,512);

  spot.castShadow = false;

  if(shutterTexture)
    spot.map = shutterTexture;

  // ----------------------------------------------------------
  // HUGE PERFORMANCE OPTIMIZATION
  //
  // Lights with zero intensity are completely hidden from
  // Three.js' lighting list.
  //
  // This is extremely important when the patch contains lots
  // of fixtures but only a small percentage are actually on.
  //
  // When a fixture turns on, it becomes visible again.
  // ----------------------------------------------------------

  spot.visible = false;

  tiltGroup.add(spot);


  // ----------------------------------------------------------
  // HAZE — cone radius scaled to this fixture's real beam width
  // ----------------------------------------------------------

  const hazeHalfAngle =
    hasZoomChannel
      ? (zoomMinRad+zoomMaxRad)/2
      : staticAngleRad;

  const hazeTopRadius =
    THREE.MathUtils.clamp(
      Math.tan(hazeHalfAngle) * 9,
      .3,
      4.5
    );

  // radialSegments=6 made this a hexagonal prism, not a cone. At the
  // narrow, fixed width every fixture used to be stuck at, the flat
  // facets were hard to notice — but now that the haze cone actually
  // rescales with zoom/iris (see the ZOOM/IRIS section of
  // updateFixtures), a wide-open beam exposes those 6 flat panels
  // directly, and with bloom on top each facet edge catches the glow
  // differently — from underneath or side-on it reads as several
  // distinct rays/beams fanning out of one fixture instead of a
  // single smooth cone. A real circular cross-section fixes it.
  //
  // radiusTop sits at local +Y, which the position.set(0,-5,0) below
  // maps to tiltGroup Y=0 — the bulb end. This used to be
  // hazeTopRadius (the WIDE, zoom-dependent radius) with the fixed
  // .18 at the far end instead — a real beam is narrow at the lens
  // and SPREADS with distance, not the other way round; the reversed
  // taper made every beam look like it was being sucked into a point
  // far from the fixture instead of properly opening up, reading as
  // an unnaturally thin, "half-finished" beam rather than a full one.
  const haze =
    new THREE.Mesh(

      new THREE.CylinderGeometry(
        .18,
        hazeTopRadius,
        10,
        32,
        1,
        true
      ),

      hazeMaterial()

    );

  haze.position.set(
    0,
    -5,
    0
  );

  haze.visible = false;

  // Layer 1 — see S.camera.layers.enable(1) and updateBeamShadows. Object3D
  // layers are NOT inherited from parent to child (only spatial transforms
  // are), so dustMotes below needs the same call even though it's a child
  // of haze.
  haze.layers.set(1);


  // ----------------------------------------------------------
  // DUST MOTES — small sprites scattered through the haze cone's own
  // volume, each catching THIS fixture's current beam colour, giving
  // the "visible specks drifting in the light" look real hazy beams
  // have that a single flat additive cone alone can't. A CHILD of
  // haze specifically (not a sibling under tiltGroup) so it inherits
  // haze's position AND scale for free — no separate per-frame
  // resize code needed when zoom/iris rescales the beam (see
  // hazeBaseRadius/hazeScale in the ZOOM/IRIS section below).
  // ----------------------------------------------------------

  const dustMotes =
    new THREE.Points(
      S.dustMoteGeometry,
      dustMoteMaterial(haze.material.uniforms)
    );

  // Baked in once here so the shared UNIT cone geometry (radius 1 at
  // its wide end) matches THIS fixture's actual starting beam width —
  // haze.scale.x/z multiplies on top of this every time zoom/iris
  // changes it, same as the cone mesh itself.
  dustMotes.scale.setScalar(hazeTopRadius);

  dustMotes.visible = false;

  dustMotes.layers.set(1);

  haze.add(dustMotes);


  tiltGroup.add(haze);

  S.haze.push(haze);


  const fixture = {

    // Original radius baked into the haze cone's CylinderGeometry at
    // creation time (see hazeTopRadius above) — kept so the ZOOM/IRIS
    // section in updateFixtures can rescale the mesh proportionally
    // (haze.scale) instead of needing to rebuild geometry every time
    // the beam angle changes.
    hazeBaseRadius:hazeTopRadius,

    group:mount,

    panGroup,
    tiltGroup,

    head,
    bulb,
    spot,
    target,
    haze,
    dustMotes,
    floorSpot,

    fx,

    def,
    map,

    archetype,

    hasZoomChannel,
    zoomMinRad,
    zoomMaxRad,

    outputScale,
    colourTemp,

    hasShutters,
    hasGobo,
    hasGobo2,
    hasPrism,
    hasManualShutters,
    shutterCanvas,
    shutterCtx,
    shutterTexture,
    lastShutters:[-1,-1,-1,-1,-1,-1,-1,-1],
    lastManualShutters:null,
    lastGobo:-1,
    lastGoboRotate:-1,
    lastGobo2:-1,
    lastGobo2Rotate:-1,
    lastPrism:-1,
    lastPrismRotate:-1,
    prismFacets:1,
    prismRotateRad:0,

    baseAddress:address(fx),

    strobePhase:0,

    manualAim:false,

    hasDMXPanTilt,

    posKey:index,

    lastR:255,
    lastG:255,
    lastB:255,

    lastDim:-1,
    lastStrobe:-1,
    lastPan:-999,
    lastTilt:-999,
    lastZoom:-1,
    lastFocus:-1,
    lastFrost:-1,
    lastIris:-1,
    irisScale:1,
    baseSpotAngle:
      hasZoomChannel
        ? (zoomMinRad+zoomMaxRad)/2
        : staticAngleRad,
    focusPenumbra:.25,
    frostPenumbra:0

  };


  if(S.fixtureManualRot.has(index)){

    const rot =
      S.fixtureManualRot.get(index);

    panGroup.rotation.y =
      rot.pan;

    tiltGroup.rotation.x =
      rot.tilt;

  }


  S.fixtureBodies.push(body);
  S.aimHeads.push(head);

  return fixture;

}


// ============================================================
// DISPOSE
// ============================================================

function disposeObject(object){

  const shared =
    new Set(
      Object.values(S.fixtureMaterial||{})
        .flatMap(set => Object.values(set))
    );

  object.traverse(child=>{

    // Shared per-archetype geometry/materials MUST NOT be
    // disposed here. Only individually-owned resources are
    // (bulb material clones, per-fixture haze materials).

    if(
      child.material &&
      !shared.has(child.material)
    ){

      if(Array.isArray(child.material)){

        child.material.forEach(
          m => m.dispose()
        );

      }else{

        child.material.dispose();

      }

    }

  });

}


// ============================================================
// REBUILD
// ============================================================

function rebuildFixtures(){

  // Every DMX-driven change calls this — sendToVisualizer() triggers
  // a full SYNC_FIXTURES round-trip on essentially every fader move,
  // so a real session with dozens of fixtures can run this hundreds
  // of times. disposeObject() (bulb material clones) and the haze
  // cone's geometry (created fresh per fixture in makeFixture, not
  // shared like body/yoke/head) used to never get released here —
  // a real, compounding leak across a long session that's an entirely
  // plausible cause of things eventually locking up/crashing once
  // enough fixtures and enough parameter changes have piled up.
  S.objects.forEach(o=>{

    if(o.group){

      disposeObject(o.group);

      S.scene.remove(
        o.group
      );

    }

    if(o.target)
      S.scene.remove(
        o.target
      );

    if(o.floorSpot){

      S.scene.remove(
        o.floorSpot
      );

      // Geometry (S.floorSpotGeometry) and texture (S.floorSpotTexture)
      // are shared across every fixture — only the per-instance material
      // belongs to this fixture alone.
      o.floorSpot.material.dispose();

    }

    if(o.shutterTexture)
      o.shutterTexture.dispose();

  });


  S.haze.forEach(h=>{

    if(h.geometry)
      h.geometry.dispose();

    if(h.material)
      h.material.dispose();

  });


  S.haze.length = 0;

  S.fixtureBodies.length = 0;
  S.aimHeads.length = 0;

  S.objects = [];

  S.lastFixtureColours.length = 0;
  S.lastFixtureIntensity.length = 0;

  S.objects =
    S.fixtures.map(
      makeFixture
    );

  // Freshly-made fixtures default to spot.visible=false (see
  // makeFixture) — every one of them would otherwise sit invisible
  // for however long it takes the next independent animate() tick to
  // notice S.dmxDirty and call updateFixtures() to re-apply the
  // current DMX state. SYNC_FIXTURES (which is what calls
  // rebuildFixtures) fires on almost every console interaction, not
  // just real fixture-list changes, so with several rebuilds landing
  // faster than that catch-up tick, every real light + haze beam
  // flickers off and back on repeatedly — reported as "the UI
  // flashes and the spotlights disappear" while actively selecting/
  // adjusting fixtures. Applying the current DMX state immediately,
  // synchronously, here means there's never a frame where a freshly
  // rebuilt fixture is incorrectly dark.
  updateFixtures(performance.now()*.001);

  S.dmxDirty = false;

  requestRender();


  statusText(
    "🟢 Rebuilt — Fixtures: " +
    S.objects.length
  );

}


// ============================================================
// APPLY LOADED POSITIONS
// ============================================================

// Saved positions/rotations always carry the fixture's stable id
// alongside its index at save time — the patch order (adding,
// removing, or re-patching fixtures) can easily change what sits at
// a given index between one session and the next, which used to
// silently hand a fixture the WRONG saved position (e.g. half of a
// 30-fixture rig landing in the wrong place after reopening). Index
// is only a fallback, for saves made before ids were recorded, or a
// fixture that's since been unpatched.
function resolveFixtureIndex(
  saved,
  idToIndex
){

  if(
    saved.fixtureId != null &&
    idToIndex.has(String(saved.fixtureId))
  ){

    return idToIndex.get(
      String(saved.fixtureId)
    );

  }

  return saved.fixtureIndex;

}

function applyLoadedPositions(
  posList,
  rotList
){

  S.fixturePositions.clear();
  S.fixtureManualRot.clear();


  const idToIndex =
    new Map(
      (S.fixtures||[]).map(
        (fx,i) => [String(fx?.id),i]
      )
    );


  posList.forEach(saved=>{

    const index =
      resolveFixtureIndex(
        saved,
        idToIndex
      );

    if(!Number.isInteger(index)) return;

    S.fixturePositions.set(
      index,
      new THREE.Vector3(
        saved.x,
        saved.y,
        saved.z
      )
    );

  });


  rotList.forEach(saved=>{

    const index =
      resolveFixtureIndex(
        saved,
        idToIndex
      );

    if(!Number.isInteger(index)) return;

    S.fixtureManualRot.set(
      index,
      {
        pan:saved.pan,
        tilt:saved.tilt
      }
    );

  });


  rebuildFixtures();

}


// ============================================================
// UPDATE FIXTURES
// ============================================================

function updateFixtures(time=0){

  let animated = false;
  let activeLights = 0;
  let atmosphereLevel = 0;

  // Highest speed value across every patched "Mirror Ball Motor" fixture
  // this frame (see MIRROR BALL MOTOR below and S.discoBall) — same
  // Math.max-across-fixtures aggregation as atmosphereLevel above, for
  // the same reason: if more than one is somehow patched, the strongest
  // command wins rather than them fighting/averaging out.
  let discoBallSpeedLevel = 0;
  let discoBallMotorPatched = false;

  // Set inside the main per-fixture loop below (see LIGHT COLOUR) —
  // stays null all frame if nothing with a real light is currently on.
  let discoBallLightColor = null;


  // Cheap pre-pass: which currently-on fixtures get a real SpotLight
  // this frame (see MAX_REAL_LIGHTS above). Deliberately only reads
  // dimmer/intensity here — the main loop below still needs to run
  // for every fixture regardless (haze, colour, gobo etc. all keep
  // working for fixtures outside the budget too, only their
  // contribution to the SHARED scene light list is capped).
  //
  // Priority is fixed PATCH ORDER, not "current brightness" — an
  // earlier version picked the N brightest fixtures fresh every
  // frame, which sounds smarter but isn't: during any fade, chase,
  // or ordinary manual adjustment, fixtures constantly cross each
  // other in brightness, so the "top N" membership reshuffled
  // continuously and lights flickered in and out of existence during
  // completely normal use, not just once past the limit. Patch order
  // only changes membership when a fixture actually crosses the on/
  // off threshold, which is rare and deliberate, not continuous.
  const lightBudget = new Set();

  // Subset of lightBudget that also casts a shadow — same fixed-patch-
  // order priority, just a smaller cap (see MAX_SHADOW_LIGHTS above).
  const shadowBudget = new Set();

  {

    let budgetUsed = 0;
    let shadowBudgetUsed = 0;

    for(let i=0; i<S.objects.length && budgetUsed<MAX_REAL_LIGHTS; i++){

      const o = S.objects[i];
      const base = o.baseAddress;
      const map = o.map;

      if(base < 0 || !map) continue;

      const dim =
        typeof map.dimmer === "number"
          ? S.dmx[base+map.dimmer]/255
          : typeof map.intensity === "number"
            ? S.dmx[base+map.intensity]/255
            : 1;

      if(dim <= .001) continue;

      lightBudget.add(i);
      budgetUsed++;

      if(shadowBudgetUsed < MAX_SHADOW_LIGHTS){
        shadowBudget.add(i);
        shadowBudgetUsed++;
      }

    }

  }


  for(
    let idx=0;
    idx<S.objects.length;
    idx++
  ){

    const o =
      S.objects[idx];

    const base =
      o.baseAddress;

    const map =
      o.map;


    if(base < 0 || !map){

      if(o.spot.visible){

        o.spot.visible = false;
        o.spot.intensity = 0;

      }

      o.bulb.material.emissiveIntensity = 0;

      if(o.haze.visible){

        o.haze.material.uniforms
          .opacity.value = 0;

      }

      if(o.dustMotes.material.uniforms.opacity.value !== 0)
        o.dustMotes.material.uniforms.opacity.value = 0;

      if(o.floorSpot.visible){
        o.floorSpot.visible = false;
        o.floorSpot.material.opacity = 0;
      }

      continue;

    }


    // --------------------------------------------------------
    // ATMOSPHERIC (fog/haze/hazer) — these have no beam at all;
    // a "light" that just defaulted to always-on full brightness
    // (the old fallback below) rendered every patched fogger as a
    // permanently-lit fresnel, which is exactly backwards. They
    // never get a spotlight/haze-cone; instead their fog/haze/
    // fluid channel feeds the scene's overall atmospheric density
    // (applied once after this loop) — an honest generic read of
    // "how much haze is in the room" without inventing a real
    // particle-fog simulation.
    // --------------------------------------------------------

    const isAtmospheric =
      o.def?.photometrics?.sourceType === "ATMOSPHERIC";

    if(isAtmospheric){

      const outputCh =
        map.fog ?? map.haze ?? map.fluid;

      if(typeof outputCh === "number"){

        atmosphereLevel =
          Math.max(
            atmosphereLevel,
            S.dmx[base+outputCh]/255
          );

      }

      if(o.spot.visible){
        o.spot.visible = false;
        o.spot.intensity = 0;
      }

      if(o.haze.visible){
        o.haze.visible = false;
        o.haze.material.uniforms.opacity.value = 0;
      }

      if(o.dustMotes.visible){
        o.dustMotes.visible = false;
        o.dustMotes.material.uniforms.opacity.value = 0;
      }

      if(o.floorSpot.visible){
        o.floorSpot.visible = false;
        o.floorSpot.material.opacity = 0;
      }

      continue;

    }


    // --------------------------------------------------------
    // MIRROR BALL MOTOR — see js/fixtures.js's "Mirror Ball Motor (1ch)"
    // entry and S.discoBall in theatre(). Same shape as ATMOSPHERIC just
    // above: not a light source, so it never gets a spotlight/haze cone
    // of its own — its one channel instead feeds S.discoBall's rotation
    // speed (applied once after this loop, in sync with atmosphereLevel).
    // --------------------------------------------------------

    const isMirrorBallMotor =
      o.def?.photometrics?.sourceType === "MIRROR_BALL_MOTOR";

    if(isMirrorBallMotor){

      discoBallMotorPatched = true;

      const speedCh = map.speed;

      if(typeof speedCh === "number"){

        discoBallSpeedLevel =
          Math.max(
            discoBallSpeedLevel,
            S.dmx[base+speedCh]/255
          );

      }

      if(o.spot.visible){
        o.spot.visible = false;
        o.spot.intensity = 0;
      }

      if(o.haze.visible){
        o.haze.visible = false;
        o.haze.material.uniforms.opacity.value = 0;
      }

      if(o.dustMotes.visible){
        o.dustMotes.visible = false;
        o.dustMotes.material.uniforms.opacity.value = 0;
      }

      if(o.floorSpot.visible){
        o.floorSpot.visible = false;
        o.floorSpot.material.opacity = 0;
      }

      continue;

    }


    // --------------------------------------------------------
    // DIMMER
