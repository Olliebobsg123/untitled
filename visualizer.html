<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Light Spark Visualiser</title>
<style>
  :root {
    --panel: rgba(10, 13, 16, 0.86);
    --border: rgba(255, 255, 255, 0.09);
    --text: #e6edf0;
    --muted: #7f8c92;
    --accent: #19d6a3;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body, #viz { width: 100%; height: 100%; overflow: hidden; }
  body { background: #000; color: var(--text); font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; user-select: none; }
  canvas { display: block; }

  .bar {
    position: fixed; top: 12px; left: 12px; right: 12px; z-index: 5;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 8px 12px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    backdrop-filter: blur(10px);
  }
  .brand { font-weight: 800; letter-spacing: 0.04em; margin-right: 4px; }
  .brand span { color: var(--accent); }
  .group { display: flex; gap: 4px; align-items: center; }
  .label { color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; margin-right: 4px; }
  button {
    height: 30px; padding: 0 11px; border-radius: 8px; border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.04); color: var(--text); font: 600 12px/1 inherit; cursor: pointer;
  }
  button:hover { background: rgba(255, 255, 255, 0.09); }
  button.on { background: rgba(25, 214, 163, 0.16); border-color: rgba(25, 214, 163, 0.5); color: #7ff0cd; }
  input[type=range] { width: 120px; accent-color: var(--accent); }
  #hazeValue { width: 36px; font-variant-numeric: tabular-nums; color: var(--muted); }
  .spacer { flex: 1; }
  #status, #fps { color: var(--muted); font-size: 12px; }
  #blind { padding: 4px 9px; border-radius: 999px; background: rgba(92, 168, 255, 0.18); color: #9cc7ff; font-weight: 800; font-size: 11px; letter-spacing: 0.06em; }

  #selection {
    position: fixed; left: 12px; bottom: 12px; z-index: 5; min-width: 260px;
    padding: 12px 14px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
  }
  #selName { font-weight: 700; font-size: 14px; }
  #selPatch { color: var(--muted); margin-top: 2px; }
  .sel-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  #selSwatch { width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--border); }
  #selLevel { font-weight: 700; font-variant-numeric: tabular-nums; }
  .hint { color: var(--muted); font-size: 11px; margin-top: 8px; }

  #help { position: fixed; right: 12px; bottom: 12px; z-index: 5; color: var(--muted); font-size: 11px; text-align: right; line-height: 1.6; }
  [hidden] { display: none !important; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./node_modules/three/build/three.module.js",
    "three/addons/": "./node_modules/three/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="viz"></div>

<div class="bar">
  <div class="brand">LIGHT<span>SPARK</span> · Visualiser</div>
  <div class="group"><span class="label">View</span>
    <button data-view="foh" title="Key 1">Front of house</button>
    <button data-view="close" title="Key 2">Front row</button>
    <button data-view="top" title="Key 3">Plan</button>
    <button data-view="side" title="Key 4">Side</button>
  </div>
  <div class="group"><span class="label">Room</span>
    <button id="house" title="H">House lights</button>
    <button id="work" title="W">Work lights</button>
    <button id="grid" title="G">Grid</button>
    <button id="beams" title="B">Beams</button>
  </div>
  <div class="group"><span class="label">Haze</span>
    <input id="haze" type="range" min="0" max="100" value="55">
    <span id="hazeValue">55%</span>
  </div>
  <button id="resetLayout">Reset layout</button>
  <div class="spacer"></div>
  <span id="blind" hidden>BLIND PREVIEW</span>
  <span id="status"></span>
  <span id="fps"></span>
</div>

<div id="selection" hidden>
  <div id="selName"></div>
  <div id="selPatch"></div>
  <div class="sel-row"><span id="selSwatch"></span><span id="selLevel"></span></div>
  <div class="hint">Drag to move · Shift = up/down · Alt = don't snap to a bar · drag the green handle to aim</div>
</div>

<div id="help">Drag a light to move it · Drag empty space to look around · Right-drag to pan · Scroll to zoom<br>Positions save automatically with the show</div>

<script type="module" src="js/visualizer/main.js"></script>
</body>
</html>
