    // --------------------------------------------------------

    const dim =
      typeof map.dimmer === "number"

      ? S.dmx[
          base + map.dimmer
        ] / 255

      : typeof map.intensity === "number"

      ? S.dmx[
          base + map.intensity
        ] / 255

      : 1;


    // --------------------------------------------------------
    // STROBE
    // --------------------------------------------------------

    let strobeValue = 0;
    let strobeActive = false;


    if(typeof map.strobe === "number"){

      strobeValue =
        S.dmx[
          base + map.strobe
        ];

      strobeActive =
        strobeValue > 10;

    }


    if(strobeActive)
      animated = true;


    // --------------------------------------------------------
    // COLOUR
    // --------------------------------------------------------

    let r = 0;
    let g = 0;
    let b = 0;


    const rCh =
      map.r ?? map.red;

    const gCh =
      map.g ?? map.green;

    const bCh =
      map.b ?? map.blue;


    if(
      rCh != null &&
      gCh != null &&
      bCh != null
    ){

      r =
        S.dmx[
          base+rCh
        ] / 255;

      g =
        S.dmx[
          base+gCh
        ] / 255;

      b =
        S.dmx[
          base+bCh
        ] / 255;

      // Extra additive primaries some RGBA/RGBAL/RGBALC fixtures
      // mix in alongside R/G/B — approximate diode tints, same
      // spirit as the CCT/kelvin approximation above (not exact
      // spectral data, just clearly-distinct, honest colour
      // contributions so each extra channel is visibly doing
      // something).
      const amberCh =
        map.a ?? map.amber;

      const limeCh =
        map.l ?? map.lime;

      const extraCyanCh =
        map.c ?? map.cyan;

      const uvCh =
        map.uv;

      if(typeof amberCh === "number"){
        const amber = S.dmx[base+amberCh]/255;
        r += amber;
        g += amber*.55;
      }

      if(typeof limeCh === "number"){
        const lime = S.dmx[base+limeCh]/255;
        r += lime*.55;
        g += lime;
        b += lime*.1;
      }

      if(typeof extraCyanCh === "number"){
        const cyan = S.dmx[base+extraCyanCh]/255;
        g += cyan*.7;
        b += cyan*.7;
      }

      if(typeof uvCh === "number"){
        const uv = S.dmx[base+uvCh]/255;
        r += uv*.35;
        b += uv*.65;
      }

      r = Math.min(1,r);
      g = Math.min(1,g);
      b = Math.min(1,b);

      // The wheel branch below is guarded to SKIP any fixture that also
      // has real cyan/magenta/yellow dichroic channels, so it falls
      // through to the CMY branch further down instead. js/controls.js's
      // dedicated CMY wheel (see isCMYSelection there) actively drives
      // cyan/magenta/yellow directly for the SolaFrame 750 and
      // CyberLight, the two fixtures in this library with both a colour
      // wheel channel and real CMY — and js/dmx.js deliberately never
      // writes their wheel channel at all once CMY is present (see the
      // hasCMYPrimary check there), leaving it at 0 rather than any
      // computed value, real or placeholder. This guard exists because
      // S.dmx[base+map.colour] being 0 is itself indistinguishable from
      // a legitimate wheel reading — without skipping the branch first,
      // this would still resolve 0 to whatever gel a fixture's own
      // colourWheel table assigns that value and show it instead of the
      // real CMY-mixed colour. A fixture with a colour wheel and no CMY
      // (every other wheel fixture in this library) has no cyan/
      // magenta/yellow map fields at all, so the guard is a no-op for
      // it and it still takes the wheel branch as before.
    }else if(
      map.colour != null &&
      !(
        typeof (map.c ?? map.cyan) === "number" &&
        typeof (map.m ?? map.magenta) === "number" &&
        typeof (map.y ?? map.yellow) === "number"
      )
    ){

      let cVal =
        S.dmx[
          base+map.colour
        ] / 255;


      if(typeof map.colourr === "number"){

        const rotate =
          S.dmx[
            base+map.colourr
          ] / 255;

        cVal =
          (cVal + rotate*.7) % 1;

      }


      // Fixtures with a real documented indexed colour wheel
      // (o.def.colourWheel) use their actual slot colours instead
      // of a generic rainbow approximation.
      const wheel = o.def?.colourWheel;

      if(Array.isArray(wheel) && wheel.length){

        const lookupVal =
          Math.round(cVal*255) % 256;

        const slot =
          wheel.find(s =>
            s &&
            lookupVal >= s.min &&
            lookupVal <= s.max
          );

        if(slot && Array.isArray(slot.rgb)){

          r = slot.rgb[0];
          g = slot.rgb[1];
          b = slot.rgb[2];

        }else{

          r = 1; g = 1; b = 1;

        }

      }else{

        const angle =
          cVal * Math.PI * 2;

        r =
          (Math.sin(angle)+1)/2;

        g =
          (Math.sin(angle+2)+1)/2;

        b =
          (Math.sin(angle+4)+1)/2;

      }

    }else if(
      typeof (map.c ?? map.cyan) === "number" &&
      typeof (map.m ?? map.magenta) === "number" &&
      typeof (map.y ?? map.yellow) === "number"
    ){

      // CMY dichroic mixing (no separate RGB LEDs at all — a
      // white source filtered by cyan/magenta/yellow gels), plus
      // an optional CTO (Correct-To-Orange) warming trim. Standard
      // subtractive approximation: each filter removes its
      // complementary primary from white light.
      const cyan =
        S.dmx[base+(map.c ?? map.cyan)]/255;

      const magenta =
        S.dmx[base+(map.m ?? map.magenta)]/255;

      const yellow =
        S.dmx[base+(map.y ?? map.yellow)]/255;

      r = 1-cyan;
      g = 1-magenta;
      b = 1-yellow;

      if(typeof map.cto === "number"){

        const ctoVal =
          S.dmx[base+map.cto]/255;

        const warm =
          kelvinToRGB(
            THREE.MathUtils.lerp(6500, 2700, ctoVal)
          );

        r *= warm.r;
        g *= warm.g;
        b *= warm.b;

        const peak =
          Math.max(r,g,b,.0001);

        r /= peak;
        g /= peak;
        b /= peak;

      }

    }else if(
      typeof map.warmWhite === "number" ||
      typeof map.naturalWhite === "number" ||
      typeof map.coolWhite === "number"
    ){

      // Tunable-white fresnels: warmWhite + coolWhite (or
      // warmWhite + naturalWhite) LED arrays whose mix ratio
      // approximates the blended colour temperature; an explicit
      // CCT trim channel, where the fixture has one, overrides
      // that with a direct Kelvin value instead (matching the
      // 2700-4500K range the CCT slider itself uses). Master
      // brightness is still the separate dimmer/intensity channel
      // handled above — these channels only ever set colour, same
      // as the RGB/colour-wheel branches above.
      const warmVal =
        typeof map.warmWhite === "number"
          ? S.dmx[base+map.warmWhite]/255
          : 0;

      const secondCh =
        typeof map.coolWhite === "number"
          ? map.coolWhite
          : map.naturalWhite;

      const secondVal =
        typeof secondCh === "number"
          ? S.dmx[base+secondCh]/255
          : 0;

      let kelvin;

      if(typeof map.cct === "number"){

        const cctVal =
          S.dmx[base+map.cct]/255;

        kelvin =
          THREE.MathUtils.lerp(2700, 4500, cctVal);

      }else{

        const total =
          warmVal + secondVal;

        const mix =
          total > 0 ? secondVal/total : 0;

        kelvin =
          THREE.MathUtils.lerp(2700, 6500, mix);

      }

      const tint =
        kelvinToRGB(kelvin);

      r = tint.r;
      g = tint.g;
      b = tint.b;

    }else{

      const wCh =
        map.w ?? map.white;

      const w =
        wCh != null

        ? S.dmx[
            base+wCh
          ] / 255

        : dim;

      // Plain dimmer/tungsten fixtures with no RGB channels are
      // tinted toward their real colour temperature instead of
      // rendering as flat white.
      if(o.colourTemp){

        r = w * o.colourTemp.r;
        g = w * o.colourTemp.g;
        b = w * o.colourTemp.b;

      }else{

        r = w;
        g = w;
        b = w;

      }

    }


    // --------------------------------------------------------
    // STROBE MODULATION
    // --------------------------------------------------------

    let strobeMod = 1;


    if(strobeActive){

      const speedHz =
        THREE.MathUtils.lerp(
          .5,
          20,
          strobeValue/255
        );

      // Clamped to >= 0 — the old ".4 + .6*sin(...)" ranged down to
      // -0.2, which handed SpotLight.intensity a negative number at
      // the bottom of every cycle (this went unnoticed only because
      // strobe never actually animated at all before — see the
      // dmxDirty fix above). A half-sine flash (on for half the
      // cycle, dark for the other half) reads as a real strobe
      // rather than a smooth pulse. `speedHz` is cycles/sec, hence
      // 2*Math.PI here, not Math.PI.
      strobeMod =
        Math.max(
          0,
          Math.sin(
            time *
            speedHz *
            2 * Math.PI
          )
        );

    }


    // --------------------------------------------------------
    // SPOT
    // --------------------------------------------------------

    const baseIntensity =
      Math.pow(dim,1.05) * 180 * o.outputScale;

    const intensity =
      baseIntensity *
      strobeMod;


    // --------------------------------------------------------
    // IMPORTANT LIGHT CULLING
    // --------------------------------------------------------
    //
    // A zero-intensity light does not need to exist in the
    // renderer's active light list.
    //
    // This is one of the biggest optimizations for large
    // fixture patches.
    //
    // spot.visible is ALSO gated on the light budget computed above
    // (MAX_REAL_LIGHTS) — past that many real lights, the GPU/driver
    // can fail to shade the static set at all (see the comment on
    // MAX_REAL_LIGHTS). haze.visible is deliberately NOT gated on the
    // budget: every "on" fixture still shows its own beam, it just
    // may stop additionally lighting up the floor/set once the
    // budget is full.

    const shouldBeVisible =
      intensity > .001;

    const hasRealLight =
      shouldBeVisible &&
      lightBudget.has(idx);


    if(o.spot.visible !== hasRealLight)
      o.spot.visible = hasRealLight;

    if(hasRealLight)
      activeLights++;


    // Only a handful of the real lights above also cast a shadow — see
    // MAX_SHADOW_LIGHTS. shadowBudget is always a subset of lightBudget,
    // so this never turns on for a fixture with no real light to begin
    // with.
    const hasShadow =
      hasRealLight &&
      shadowBudget.has(idx);

    if(o.spot.castShadow !== hasShadow)
      o.spot.castShadow = hasShadow;


    if(shouldBeVisible){

      if(!o.haze.visible)
        o.haze.visible = true;

      if(!o.dustMotes.visible)
        o.dustMotes.visible = true;

    }else{

      if(o.haze.visible){
        o.haze.visible = false;
        o.haze.material.uniforms.opacity.value = 0;
      }

      if(o.dustMotes.visible){
        o.dustMotes.visible = false;
        o.dustMotes.material.uniforms.opacity.value = 0;
      }

    }


    if(
      o.lastDim !== dim ||
      o.lastStrobe !== strobeValue ||
      o.spot.intensity !== intensity
    ){

      o.spot.intensity =
        intensity;

      o.lastDim = dim;
      o.lastStrobe = strobeValue;

    }


    // --------------------------------------------------------
    // LIGHT COLOUR
    // --------------------------------------------------------

    const colour =
      o.spot.color;


    const rr =
      Math.max(r,.001);

    const gg =
      Math.max(g,.001);

    const bb =
      Math.max(b,.001);


    if(
      o.lastR !== rr ||
      o.lastG !== gg ||
      o.lastB !== bb
    ){

      colour.setRGB(
        rr,
        gg,
        bb
      );

      o.lastR = rr;
      o.lastG = gg;
      o.lastB = bb;

      o.bulb.material.color.setRGB(
        Math.max(r,.02),
        Math.max(g,.02),
        Math.max(b,.02)
      );

      o.bulb.material.emissive.copy(
        colour
      );

    }


    // First real light found this frame, in patch order — same priority
    // convention MAX_REAL_LIGHTS/MAX_SHADOW_LIGHTS already use elsewhere
    // in this file. Read by updateDiscoBallSpots so the ball's own
    // reflected glints pick up roughly whatever colour is actually
    // lighting the room, instead of always showing plain white regardless
    // of what's really on.
    if(hasRealLight && !discoBallLightColor){

      discoBallLightColor =
        colour.clone();

    }


    // --------------------------------------------------------
    // BULB
    // --------------------------------------------------------

    const bulbIntensity =
      dim * 20 * strobeMod;


    if(
      o.bulb.material.emissiveIntensity !==
      bulbIntensity
    ){

      o.bulb.material.emissiveIntensity =
        bulbIntensity;

    }


    // --------------------------------------------------------
    // HAZE
    // --------------------------------------------------------

    if(o.haze.visible){

      o.haze.material.uniforms
        .color.value.copy(colour);

      // A real beam is barely visible in clean air — what you actually
      // see is haze/fog particles scattering light back at you. This
      // used to be a fixed .13 regardless of whether any hazer in the
      // room was even running, so turning a hazer on or off (or up)
      // never visibly changed the beams themselves, only the general
      // background fog (see S.scene.fog above). atmosphereFactor keeps
      // the exact old look at zero haze (factor 1, no regression) and
      // scales beams up to noticeably thicker/more visible as the
      // room's actual haze density (S.atmosphereLevel, from any
      // ATMOSPHERIC fixture's fog/haze channel) rises.
      const atmosphereFactor =
        1 + (S.atmosphereLevel ?? 0) * 2;

      o.haze.material.uniforms
        .opacity.value =
          Math.pow(dim,1.15) *
          .13 *
          strobeMod *
          atmosphereFactor;

      // Same beam colour and atmosphere response as the cone above —
      // individually visible points read as much brighter than the
      // same opacity spread over the cone's full surface, hence the
      // higher base multiplier (.35 vs .13) for a similar-strength
      // "sparkle" rather than a wash of solid dots.
      o.dustMotes.material.uniforms
        .color.value.copy(colour);

      o.dustMotes.material.uniforms
        .opacity.value =
          Math.min(
            1,
            Math.pow(dim,1.15) *
            .35 *
            strobeMod *
            atmosphereFactor
          );

    }


    // --------------------------------------------------------
    // PAN / TILT
    // --------------------------------------------------------

    if(!o.hasDMXPanTilt){

      const rot =
        S.fixtureManualRot.get(idx);

      if(rot){

        if(
          o.lastPan !== rot.pan ||
          o.lastTilt !== rot.tilt
        ){

          o.panGroup.rotation.y =
            rot.pan;

          o.tiltGroup.rotation.x =
            rot.tilt;

          o.lastPan = rot.pan;
          o.lastTilt = rot.tilt;

        }

      }

    }else{

      if(typeof map.pan === "number"){

        const pan =
          S.dmx[
            base+map.pan
          ] / 255;

        const panAngle =
          THREE.MathUtils.degToRad(
            THREE.MathUtils.lerp(
              -180,
              180,
              pan
            )
          );


        if(
          Math.abs(
            o.lastPan-panAngle
          ) > .00001
        ){

          o.panGroup.rotation.y =
            panAngle;

          o.lastPan =
            panAngle;

        }

      }


      if(typeof map.tilt === "number"){

        const tilt =
          S.dmx[
            base+map.tilt
          ] / 255;

        const tiltAngle =
          THREE.MathUtils.degToRad(
            THREE.MathUtils.lerp(
              -90,
              90,
              tilt
            )
          );


        if(
          Math.abs(
            o.lastTilt-tiltAngle
          ) > .00001
        ){

          o.tiltGroup.rotation.x =
            tiltAngle;

          o.lastTilt =
            tiltAngle;

        }

      }

    }


    // --------------------------------------------------------
    // AIM TARGET
    // --------------------------------------------------------

    const panAngle =
      o.panGroup.rotation.y;

    const tiltAngle =
      o.tiltGroup.rotation.x;


    tempDirection.set(
      0,
      -1,
      0
    );


    tempDirection.applyAxisAngle(
      tiltAxis,
      tiltAngle
    );

    tempDirection.applyAxisAngle(
      panAxis,
      panAngle
    );


    o.spot.getWorldPosition(
      tempWorldPosition
    );


    tempTargetPosition
      .copy(tempDirection)
      .multiplyScalar(30)
      .add(tempWorldPosition);


    if(
      o.target.position.distanceToSquared(
        tempTargetPosition
      ) > .000001
    ){

      o.target.position.copy(
        tempTargetPosition
      );

    }


    // --------------------------------------------------------
    // ZOOM
    // --------------------------------------------------------

    let zoomChanged = false;

    if(o.hasZoomChannel){

      const zoomVal =
        S.dmx[
          base+map.zoom
        ];


      if(
        o.lastZoom !== zoomVal
      ){

        // 0 = narrowest real beam angle for this fixture,
        // 255 = widest — instead of one generic range shared
        // by every zoom fixture regardless of its real spec.
        o.baseSpotAngle =
          THREE.MathUtils.lerp(
            o.zoomMinRad,
            o.zoomMaxRad,
            zoomVal/255
          );

        o.lastZoom =
          zoomVal;

        zoomChanged = true;

      }

    }


    // --------------------------------------------------------
    // IRIS
    // --------------------------------------------------------
    //
    // A real iris closes to a hard-edged, narrower aperture —
    // physically separate from zoom's optical angle change, so it
    // applies as its own multiplier on top of whatever angle zoom
    // (or the fixture's fixed beam angle) already set.

    let irisChanged = false;

    if(typeof map.iris === "number"){

      const irisVal =
        S.dmx[
          base+map.iris
        ];

      if(
        o.lastIris !== irisVal
      ){

        // 0 = closed down to a pinhole, 255 = fully open.
        o.irisScale =
          THREE.MathUtils.lerp(.05, 1, irisVal/255);

        o.lastIris =
          irisVal;

        irisChanged = true;

      }

    }

    if(zoomChanged || irisChanged){

      o.spot.angle =
        o.baseSpotAngle * (o.irisScale ?? 1);

      // The haze cone's geometry is baked at fixture creation from a
      // generic MIDPOINT angle (see hazeTopRadius/hazeBaseRadius in
      // makeFixture) and never updated on its own — without rescaling
      // it here, a fixture with a wide zoom range (e.g. the SolaFrame
      // 750's 3.8°-55°) keeps showing that same fixed midpoint-width
      // haze cone regardless of the real, currently-narrower or wider
      // spot.angle actually set above. That reads as "the beam doesn't
      // respond to zoom" / a second, wrongly-wide beam sitting around
      // the correctly narrow masked light. Uniformly scaling the cone's
      // cross-section to match the CURRENT angle keeps it in sync.
      const hazeRadius =
        THREE.MathUtils.clamp(
          Math.tan(o.spot.angle) * 9,
          .3,
          4.5
        );

      const hazeScale =
        hazeRadius / o.hazeBaseRadius;

      o.haze.scale.x =
        hazeScale;

      o.haze.scale.z =
        hazeScale;

    }


    // --------------------------------------------------------
    // FLOOR SPOT — see the comment on S.groundMeshes in theatre()
    // and on MAX_REAL_LIGHTS above. This decal exists ONLY to give
    // fixtures WITHOUT a real light (hasRealLight false — past the
    // MAX_REAL_LIGHTS budget) a landing glow, since they'd otherwise
    // show no illumination on the floor/stage at all. A fixture that
    // DOES have a real light already gets a proper, physically-lit
    // circle on the floor from that actual THREE.SpotLight — its
    // size, falloff and edge sharpness come from real lighting math
    // (angle, penumbra, distance attenuation), which this decal's
    // hand-computed flat circle never exactly matches. Showing both
    // at once puts two different-sized, differently-edged bright
    // circles on top of each other at the same landing point — read
    // as "it spawns two beams instead of one" while zoom/iris was
    // being adjusted (the mismatch is most obvious right as either
    // changes the real light's cone size but this decal lags/differs
    // slightly). Gating on !hasRealLight keeps exactly one of the two
    // showing at any moment, never both.
    //
    // Placed AFTER the ZOOM/IRIS block above rather than right after
    // AIM TARGET (where it originally lived) — it needs o.spot.angle,
    // which THIS frame's zoom/iris values only update above. Reading
    // it any earlier in the loop meant the floor decal was always one
    // DMX update behind.
    // --------------------------------------------------------

    beamRaycaster.set(
      tempWorldPosition,
      tempDirection
    );

    // A fixture mounted directly on a truss bar has its bulb sitting
    // right at (sometimes fractionally inside) that same bar's own
    // cylinder geometry — now one of S.beamOccluders (see BEAM LENGTH
    // below and the comment on mesh()). Without a minimum distance, the
    // ray's own mounting truss registers as "the beam hit something"
    // essentially at distance zero, collapsing beamLength — and with it
    // haze.scale.y and every dust mote riding along as its child — down
    // to nearly nothing for most fixtures in a real rig, which is most
    // of them clamped to one of the four truss bars. 1 unit clears any
    // fixture's own body/yoke/truss-clamp radius while still catching a
    // genuine curtain, wall, or a DIFFERENT truss bar the beam actually
    // crosses further along its path.
    beamRaycaster.near = 1;

    // Computed regardless of hasRealLight now — BEAM LENGTH below needs
    // the real throw distance for every visible fixture, not just the
    // ones using the floor decal. (See rawBeamHit's two consumers below:
    // floorHit keeps the old !hasRealLight-gated decal behaviour exactly,
    // beamLength does not.)
    const rawBeamHit =
      shouldBeVisible &&
      // Require a meaningfully downward aim — a beam near-parallel
      // to a surface would otherwise produce a valid but absurdly
      // distant/huge/grazing hit.
      tempDirection.y < -.05 &&
      S.groundMeshes?.length
        ? beamRaycaster.intersectObjects(
            S.groundMeshes,
            false
          )[0]
        : null;

    // Landing spot decal only ever shown for fixtures without a real
    // light (see the comment above) and only for reasonably close hits —
    // at a shallow, near-horizontal aim the -.05 check above still lets
    // through a mathematically valid hit that can be dozens of units
    // away, disconnected from where the visible beam actually reads on
    // screen. This cap is about the DECAL's own footprint, unrelated to
    // beamLength below, which is allowed to reach much further.
    const floorHit =
      !hasRealLight && rawBeamHit && rawBeamHit.distance <= 14
        ? rawBeamHit
        : null;

    // --------------------------------------------------------
    // BEAM LENGTH — stretch the haze cone (and, since dustMotes is its
    // child, the dust motes with it) to reach whatever the beam actually
    // hits, instead of a fixed 10 units regardless of rig height or aim.
    // A beam aimed at the floor from a low truss used to visibly stop
    // short of the floor it was lighting — "half a beam" rather than the
    // full, real throw a physical fixture would make.
    //
    // rawBeamHit alone isn't enough to base this on: it only tests
    // S.groundMeshes (floor+stage — see the FLOOR SPOT comment above),
    // and a single finite ~50x50 floor plane at that (see theatre()), so
    // (a) any fixture mounted or aimed outside that small footprint —
    // completely normal in a real, wide rig — got NO hit at all and fell
    // back to a fixed short stub while neighbouring fixtures that DID
    // land within those bounds stretched out much further (the exact
    // "why is this one only half a beam" complaint this was meant to
    // fix, just moved from "always too short" to "inconsistently too
    // short"), and (b) a beam aimed at a curtain, truss bar, or the
    // proscenium wall isn't in S.groundMeshes at all, so it kept
    // computing the distance to the FLOOR beyond that scenery and
    // visibly ran the haze cone straight through solid geometry to reach
    // it. rawOccluderHit tests S.beamOccluders — every set piece theatre()
    // builds, not just the floor (see the comment on mesh() above) — so a
    // curtain or truss actually in the way is what stops the beam, and
    // the ANALYTIC distance to the floor's y=0 plane (rather than
    // groundMeshes' finite edges) is only the fallback for when nothing
    // solid is hit at all.
    if(shouldBeVisible){

      const rawOccluderHit =
        S.beamOccluders?.length
          ? beamRaycaster.intersectObjects(
              S.beamOccluders,
              false
            )[0]
          : null;

      const analyticFloorDistance =
        tempDirection.y < -.05
          ? -tempWorldPosition.y / tempDirection.y
          : NaN;

      const fallbackLength =
        Number.isFinite(analyticFloorDistance) &&
        analyticFloorDistance > 0
          ? analyticFloorDistance
          : 10;

      const beamLength =
        Math.min(
          rawOccluderHit
            ? rawOccluderHit.distance
            : fallbackLength,
          40
        );

      o.haze.scale.y =
        beamLength/10;

      o.haze.position.y =
        -beamLength/2;

    }

    if(floorHit){

      if(!o.floorSpot.visible)
        o.floorSpot.visible = true;

      // Both ground meshes (floor, stage top) are flat and
      // horizontal, so nudging straight up along world Y is enough
      // to clear z-fighting with whichever one was actually hit.
      o.floorSpot.position.copy(
        floorHit.point
      );

      o.floorSpot.position.y += .02;

      // Beam radius on the floor grows with throw distance and with
      // how wide-open the fixture's beam angle currently is. Uses
      // o.spot.angle (zoom AND iris combined, freshly updated above
      // this frame), not o.baseSpotAngle (zoom alone) — a closed-down
      // iris correctly narrows the real spotlight and haze cone, but
      // baseSpotAngle here would still size the floor glow as if the
      // iris were wide open.
      const radius =
        THREE.MathUtils.clamp(
          Math.tan(o.spot.angle) * floorHit.distance,
          .3,
          9
        );

      o.floorSpot.scale.setScalar(radius);

      o.floorSpot.material.color.copy(colour);

      o.floorSpot.material.opacity =
        Math.pow(dim,1.15) *
        .5 *
        strobeMod;

    }else if(o.floorSpot.visible){

      o.floorSpot.visible = false;
      o.floorSpot.material.opacity = 0;

    }


    // --------------------------------------------------------
    // FOCUS
    // --------------------------------------------------------

    let penumbraChanged = false;

    if(typeof map.focus === "number"){

      const focusVal =
        S.dmx[
          base+map.focus
        ];


      if(
        o.lastFocus !== focusVal
      ){

        o.focusPenumbra =
          THREE.MathUtils.lerp(
            .25,
            .9,
            focusVal/255
          );

        o.lastFocus =
          focusVal;

        penumbraChanged = true;

      }

    }


    // --------------------------------------------------------
    // FROST / DIFFUSION
    // --------------------------------------------------------
    //
    // A frost filter softens the beam edge — the same physical
    // read as Focus's penumbra, just a separate real-world part
    // (a diffusion filter vs. the lens). The two combine rather
    // than fight: whichever asks for the softer edge wins. Frost
    // also blurs the projected gobo/shutter texture itself, which
    // is the more visible real-world effect of a frost filter.

    let frostChanged = false;

    if(typeof map.frost === "number"){

      const frostVal =
        S.dmx[
          base+map.frost
        ];


      if(
        o.lastFrost !== frostVal
      ){

        // Real diffusion channels are often mode-based (hard edge /
        // variable / soft / strobe) rather than a plain 0-255 ramp;
        // this treats the whole range as increasing softness, which
        // is the honest approximation without per-fixture mode data.
        o.frostPenumbra =
          THREE.MathUtils.lerp(
            0,
            .9,
            frostVal/255
          );

        o.lastFrost =
          frostVal;

        penumbraChanged = true;
        frostChanged = true;

      }

    }

    const frostBlur =
      (o.frostPenumbra||0) * 6;


    if(penumbraChanged){

      o.spot.penumbra =
        Math.max(
          o.focusPenumbra||0,
          o.frostPenumbra||0
        );

    }


    // --------------------------------------------------------
    // PRISM
    // --------------------------------------------------------
    //
    // A real prism attachment splits the beam into several offset
    // copies of whatever it's projecting. There's no true multi-
    // beam optic here — instead, once engaged, the composited
    // gobo/shutter pattern is stamped onto itself several more
    // times at rotated offsets (see applyPrismEffect), which is
    // the same duplication a real prism produces, just done as a
    // 2D approximation instead of true beam-splitting. Facet count
    // is a stylised default (3), not a manufacturer spec — most
    // fixtures' prism channels don't publish an exact facet count
    // for a plain engage/rotate control.

    let prismChanged = false;

    if(o.hasPrism){

      const prismVal =
        S.dmx[base+map.prism];

      const prismRotateVal =
        typeof map.prismr === "number"
          ? S.dmx[base+map.prismr]
          : 128;

      if(
        o.lastPrism !== prismVal ||
        o.lastPrismRotate !== prismRotateVal
      ){

        prismChanged = true;

        o.lastPrism = prismVal;
        o.lastPrismRotate = prismRotateVal;

        // Real prism-mode channels are often mode-based (disengaged
        // / continuous / forward-spin / etc) rather than a plain
        // facet-count ramp; this just treats "above a low threshold"
        // as engaged, which is the honest approximation without
        // per-fixture mode data.
        o.prismFacets =
          prismVal > 15 ? 3 : 1;

        o.prismRotateRad =
          THREE.MathUtils.degToRad(
            THREE.MathUtils.lerp(0, 360, prismRotateVal/255)
          );

      }

    }


    // --------------------------------------------------------
    // GOBO
    // --------------------------------------------------------

    let goboChanged = false;
    let goboState = null;

    if(o.hasGobo){

      const goboVal =
        S.dmx[base+map.gobo];

      const goboRotateVal =
        typeof map.gobor === "number"
          ? S.dmx[base+map.gobor]
          : 128;

      if(
        o.lastGobo !== goboVal ||
        o.lastGoboRotate !== goboRotateVal
      ){

        goboChanged = true;

        o.lastGobo = goboVal;
        o.lastGoboRotate = goboRotateVal;

      }

      goboState = {
        // 8 equal buckets — bucket 0 is always "Open".
        pattern: Math.min(7, Math.floor(goboVal/32)),
        rotateRad:
          THREE.MathUtils.degToRad(
            THREE.MathUtils.lerp(-180, 180, goboRotateVal/255)
          )
      };

    }


    // --------------------------------------------------------
    // GOBO 2 — a second, independent gobo wheel some fixtures
    // carry in series with the first (its aperture multiplies
    // with wheel 1's, see drawShutterMask).
    // --------------------------------------------------------

    let gobo2Changed = false;
    let gobo2State = null;

    if(o.hasGobo2){

      const gobo2Val =
        S.dmx[base+map.gobo2];

      const gobo2RotateVal =
        typeof map.gobo2r === "number"
          ? S.dmx[base+map.gobo2r]
          : 128;

      if(
        o.lastGobo2 !== gobo2Val ||
        o.lastGobo2Rotate !== gobo2RotateVal
      ){

        gobo2Changed = true;

        o.lastGobo2 = gobo2Val;
        o.lastGobo2Rotate = gobo2RotateVal;

      }

      gobo2State = {
        pattern: Math.min(7, Math.floor(gobo2Val/32)),
        rotateRad:
          THREE.MathUtils.degToRad(
            THREE.MathUtils.lerp(-180, 180, gobo2RotateVal/255)
          )
      };

    }


    // --------------------------------------------------------
    // FRAMING SHUTTERS
    // --------------------------------------------------------

    let shutterChanged = false;

    if(o.hasShutters){

      for(let b=0;b<4;b++){

        const insertCh =
          map[`shutter${b+1}Insert`];

        const rotateCh =
          map[`shutter${b+1}Rotate`];

        const angleACh =
          map[`shutter${b+1}AngleA`];

        const angleBCh =
          map[`shutter${b+1}AngleB`];

        let insertVal, rotateVal;

        if(
          typeof angleACh === "number" ||
          typeof angleBCh === "number"
        ){

          // Two-point blade (e.g. High End Systems SolaFrame):
          // each end of the blade edge has its own channel.
          // Average position = how far in the blade sits;
          // the difference between the two ends = how much
          // it's tilted relative to its default orientation.
          const a =
            typeof angleACh === "number"
              ? S.dmx[base+angleACh]
              : 0;

          const bVal =
            typeof angleBCh === "number"
              ? S.dmx[base+angleBCh]
              : 0;

          insertVal = Math.round((a+bVal)/2);
          rotateVal =
            Math.max(0, Math.min(255,
              Math.round(128 + (a-bVal)/2)
            ));

        }else{

          insertVal =
            typeof insertCh === "number"
              ? S.dmx[base+insertCh]
              : 0;

          rotateVal =
            typeof rotateCh === "number"
              ? S.dmx[base+rotateCh]
              : 128;

        }

        if(
          o.lastShutters[b*2] !== insertVal ||
          o.lastShutters[b*2+1] !== rotateVal
        ){

          shutterChanged = true;

          o.lastShutters[b*2] = insertVal;
          o.lastShutters[b*2+1] = rotateVal;

        }

      }

    }


    // --------------------------------------------------------
    // MANUAL BARN DOORS — not DMX at all. Real fresnels/PAR cans
    // commonly carry a physical 4-way barn door frame that's
    // shaped by hand at the fixture rather than over DMX; this
    // mirrors that exactly — a per-fixture shape read straight
    // off the fixture instance (fixture.manualShutters, set from
    // the Barn Doors card in the UI) rather than off S.dmx.
    // --------------------------------------------------------

    let manualChanged = false;
    let manualBlades = [];

    if(o.hasManualShutters){

      const m = o.fx?.manualShutters;

      const rotateBase =
        m?.rotate ?? 0;

      manualBlades =
        SHUTTER_BASE_DEG.map((baseDeg,b)=>({
          insert:
            Math.max(0, Math.min(100,
              m?.[`b${b+1}`] ?? 0
            ))/100,
          angleDeg: baseDeg + rotateBase
        }));

      const signature =
        `${manualBlades.map(bl=>bl.insert).join(",")}|${rotateBase}`;

      if(o.lastManualShutters !== signature){
        manualChanged = true;
        o.lastManualShutters = signature;
      }

    }


    // Gobo pattern, shutter cuts, prism duplication and frost
    // blur all share one texture — redraw it whenever any of
    // them has changed. `o.lastShutters` always holds the current
    // blade state regardless of whether it changed on THIS tick,
    // so blades can simply be rebuilt from it whenever a redraw is
    // needed for any reason.
    if(
      (o.hasShutters || o.hasGobo || o.hasGobo2 || o.hasPrism || o.hasManualShutters) &&
      (shutterChanged || goboChanged || gobo2Changed || prismChanged || frostChanged || manualChanged)
    ){

      const blades =
        o.hasShutters
          ? SHUTTER_BASE_DEG.map((baseDeg,b)=>({
              insert:o.lastShutters[b*2]/255,
              angleDeg:
                baseDeg +
                THREE.MathUtils.lerp(
                  -90, 90, o.lastShutters[b*2+1]/255
                )
            }))
          : o.hasManualShutters
            ? manualBlades
            : [];

      drawShutterMask(
        o.shutterCtx,
        o.shutterCanvas.width,
        blades,
        goboState,
        gobo2State,
        o.hasPrism ? {facets:o.prismFacets, rotateRad:o.prismRotateRad} : null,
        frostBlur
      );

      o.shutterTexture.needsUpdate = true;

    }

  }


  if(S.scene.fog){

    S.scene.fog.near =
      THREE.MathUtils.lerp(50, 6, atmosphereLevel);

    S.scene.fog.far =
      THREE.MathUtils.lerp(110, 35, atmosphereLevel);

  }


  // Read by every fixture's own HAZE opacity above — but atmosphereLevel
  // isn't fully known until every fixture (including whichever one is
  // the actual hazer) has been visited, which only happens at the end of
  // THIS loop. Rather than run a second pass over every fixture just to
  // apply a value that only ever changes as smoothly as a hazer's own
  // DMX ramp, each fixture reads last frame's level (one frame of lag,
  // imperceptible at any real hazer fade rate) and this line hands the
  // now-finished value forward for the next frame to use.
  S.atmosphereLevel =
    atmosphereLevel;


  // Read by the DISCO BALL section of animate() — see the comment there
  // for why an unpatched motor keeps the ball's original gentle idle
  // spin instead of stopping it dead.
  S.discoBallSpeedLevel =
    discoBallSpeedLevel;

  S.discoBallMotorPatched =
    discoBallMotorPatched;

  S.discoBallLightColor =
    discoBallLightColor;


  S.activeLights =
    activeLights;

  S.animated =
    animated;


  // Bloom (not exposure — see the comment on BASE_BLOOM_STRENGTH near
  // the top of the file) is what's scaled down as more lights go
  // active, so a big rig doesn't bloom-wash the whole frame out to
  // white. toneMappingExposure stays fixed at BASE_TONE_EXPOSURE.
  const bloomScale =
    Math.min(
      1,
      REFERENCE_ACTIVE_LIGHTS /
      Math.max(1, activeLights)
    );

  S.bloomPass.strength =
    BASE_BLOOM_STRENGTH *
    bloomScale;

}


// ============================================================
// BEAM SHADOWS
// ============================================================

// Renders a small, independent depth-only pass per shadow-slotted fixture
// (see MAX_SHADOW_LIGHTS/S.beamShadowRTs) from that fixture's own point of
// view, then hands each one's haze material the resulting depth texture +
// matrix so its fragment shader can darken exactly the part of the beam
// sitting behind a real occluder — a genuine "haze shadow" cast into the
// visible beam volume, not just onto the floor. Deliberately separate from
// three.js's own automatic spot.shadow.map/camera (used for the real
// floor/truss shadow from the actual SpotLight): reusing that one directly
// would mean fighting three.js's internal shadow-sampler texture setup
// (WebGL2 depth-compare samplers aren't safely readable as a plain
// sampler2D) for no benefit, when a dedicated camera/target per slot is
// simple, cheap (MAX_SHADOW_LIGHTS is at most 3, low resolution, depth-
// only), and fully under our own control.
//
// Called from animate() right after updateFixtures(), inside the same
// "did anything actually change" gate — a beam shadow only needs
// recomputing when the DMX state driving pan/tilt/zoom/on-off did.
function updateBeamShadows(){

  let slot = 0;

  for(
    let idx=0;
    idx<S.objects.length && slot<MAX_SHADOW_LIGHTS;
    idx++
  ){

    const o = S.objects[idx];

    if(!o.spot.castShadow) continue;

    const camera =
      S.beamShadowCameras[slot];

    const rt =
      S.beamShadowRTs[slot];

    // getWorldPosition() forces a fresh recompute of this object's own
    // and its ancestors' matrices on demand (see the identical pattern
    // already used for tempWorldPosition/o.spot in the AIM TARGET section
    // of updateFixtures above) — safe to call here, after updateFixtures
    // has already finished setting this frame's pan/tilt/rotation values,
    // without needing a separate scene-wide updateMatrixWorld() call.
    o.spot.getWorldPosition(camera.position);

    const targetPos = beamShadowTempTarget;

    o.target.getWorldPosition(targetPos);

    camera.up.set(0,1,0);
    camera.lookAt(targetPos);

    // A little wider than the real cone (spot.angle is a half-angle) so
    // the depth map fully covers the visible haze cross-section right out
    // to its soft edge, not just its hard core.
    camera.fov =
      THREE.MathUtils.clamp(
        THREE.MathUtils.radToDeg(o.spot.angle) * 2 + 6,
        4,
        170
      );

    camera.near = .3;
    camera.far = 55;
    camera.aspect = 1;
    camera.updateProjectionMatrix();

    const prevOverride = S.scene.overrideMaterial;

    S.scene.overrideMaterial =
      S.beamShadowDepthMaterial;

    S.renderer.setRenderTarget(rt);
    S.renderer.clear();
    S.renderer.render(S.scene, camera);

    S.scene.overrideMaterial = prevOverride;

    o.haze.material.uniforms
      .beamShadowMatrix.value
        .copy(S.beamShadowBiasMatrix)
        .multiply(camera.projectionMatrix)
        .multiply(camera.matrixWorldInverse);

    o.haze.material.uniforms
      .beamShadowMap.value =
        rt.texture;

    o.haze.material.uniforms
      .useShadow.value = 1;

    o.beamShadowSlot = slot;

    slot++;

  }

  // Every fixture NOT assigned a slot this frame (including ones that
  // held one last frame but lost it) renders its haze exactly as before —
  // useShadow=0 means the shader never samples beamShadowMap at all, so a
  // stale/reassigned texture reference left over from a previous slot
  // holder is harmless.
  for(
    let idx=0;
    idx<S.objects.length;
    idx++
  ){

    const o = S.objects[idx];

    // Loose check: catches both "never assigned" (undefined) and
    // "already reset" (null) — slot 0 is a legitimate, falsy-but-valid
    // value that a plain `if(!o.beamShadowSlot)` would wrongly skip.
    if(o.beamShadowSlot == null) continue;

    if(!o.spot.castShadow){

      o.haze.material.uniforms
        .useShadow.value = 0;

      o.beamShadowSlot = null;

    }

  }

  S.renderer.setRenderTarget(null);

}


// ============================================================
// DISCO BALL SPOTS
// ============================================================

// Rebuilds every one of S.discoBallSpots' DISCO_BALL_SPOT_COUNT instance
// transforms from scratch each call — see the DISCO BALL SPOTS comment in
// theatre() for what this is and why it's landing spots rather than
// visible rays. Called from animate() right after the ball's own
// rotation is updated for this frame, so S.discoBall.quaternion below is
// already current.
function updateDiscoBallSpots(){

  // One shared colour for every spot this frame, tinted roughly to
  // whatever's actually lighting the room right now (see the
  // discoBallLightColor comment in updateFixtures), rather than always
  // plain white. Per-INSTANCE colour (via InstancedMesh.setColorAt) was
  // tried first so each spot could also fade individually, but that
  // never actually reached the screen — S.floorSpotGeometry has no
  // vertex "color" attribute of its own, and instance colour rendered as
  // fully transparent/invisible without it regardless of material
  // opacity, confirmed by a before/after pixel diff showing zero change
  // with the InstancedMesh toggled visible or not. Per-facet fade is
  // handled by scaling each instance's SIZE by its own brightness
  // instead (see below) — not identical to a true opacity fade, but a
  // dim facet already reading as "a small spot" rather than "no spot at
  // all" still looks like a real glint catching the light at a shallow
  // angle, and unlike instance colour this is proven to actually render.
  S.discoBallSpots.material.color.copy(
    S.discoBallLightColor || discoBallSpotWhite
  );

  const directions =
    S.discoBallSpotDirections;

  for(let i=0;i<directions.length;i++){

    // This facet's current outward normal — a fixed point on the ball's
    // own surface, rotated by however far the ball has turned so far.
    discoBallFacetNormal
      .copy(directions[i])
      .applyQuaternion(S.discoBall.quaternion);

    // A facet pointing away from the key light can't be catching it at
    // all — real disco balls only sparkle where light actually reaches,
    // which is what makes only a shifting SUBSET of tiles lit at any
    // moment rather than the whole ball glowing uniformly.
    const facingLight =
      -discoBallFacetNormal.dot(
        DISCO_BALL_KEY_LIGHT_DIRECTION
      );

    // Nothing left to compute for a facet nowhere near facing the light —
    // skip the raycast entirely rather than doing real work for
    // something that's about to render as fully transparent anyway.
    if(facingLight < DISCO_BALL_SPOT_FADE_START){

      discoBallSpotMatrix.makeScale(0,0,0);

      S.discoBallSpots.setMatrixAt(
        i,
        discoBallSpotMatrix
      );

      continue;

    }

    // Smoothstep from FADE_START to FADE_END rather than one hard cutoff
    // — a facet rotating past the lit threshold used to visibly POP a
    // spot fully on or fully off from one frame to the next; fading
    // brightness in and out over that range instead reads as the
    // gradual catch-the-light glint a real mirror ball actually shows,
    // not a flicker.
    const fadeT =
      THREE.MathUtils.clamp(
        (facingLight-DISCO_BALL_SPOT_FADE_START)/
          (DISCO_BALL_SPOT_FADE_END-DISCO_BALL_SPOT_FADE_START),
        0,
        1
      );

    const brightness =
      fadeT*fadeT*(3-2*fadeT);

    // Law of reflection off this facet's normal — NOT the facet's own
    // outward direction (an earlier version used that directly, which is
    // exactly why it visibly tracked the ball's rotation instead of
    // sweeping independently the way a real mirror ball's glints do).
    discoBallSpotDirection
      .copy(DISCO_BALL_KEY_LIGHT_DIRECTION)
      .reflect(discoBallFacetNormal);

    // Ball radius is exactly 1 (see its SphereGeometry in theatre()) —
    // starting the reflected ray exactly on that surface, at this
    // facet's current (rotated) position, is what discoBallRaycaster.near
    // below is measured from.
    discoBallSpotOrigin
      .copy(discoBallFacetNormal)
      .add(S.discoBall.position);

    discoBallRaycaster.set(
      discoBallSpotOrigin,
      discoBallSpotDirection
    );

    // Small but non-zero — the ball itself is in S.beamOccluders (every
    // mesh mesh() creates is, see its own comment), and this ray's own
    // origin sits exactly on that same sphere's surface, so a near of 0
    // would immediately self-intersect the ball at distance ~0.
    discoBallRaycaster.near = .05;
    discoBallRaycaster.far = DISCO_BALL_SPOT_MAX_DISTANCE;

    const hit =
      discoBallRaycaster.intersectObjects(
        S.beamOccluders,
        false
      )[0];

    // Reflected out into open space with nothing nearby to land on —
    // shown nowhere, rather than projected onto empty air.
    if(!hit){

      discoBallSpotMatrix.makeScale(0,0,0);

      S.discoBallSpots.setMatrixAt(
        i,
        discoBallSpotMatrix
      );

      continue;

    }

    // Raycaster face normals are in the HIT OBJECT's own local space —
    // transformDirection converts to world space using that object's
    // current orientation, which is what actually orients this spot
    // flush against the real surface it landed on (a wall reads
    // differently from the floor).
    discoBallFacetNormal
      .copy(hit.face.normal)
      .transformDirection(hit.object.matrixWorld)
      .normalize();

    // Nudged slightly off the surface along its own normal — otherwise
    // this decal and the surface itself z-fight at essentially the same
    // depth, same reasoning as the ordinary FLOOR SPOT decal elsewhere in
    // this file.
    discoBallSpotOrigin
      .copy(hit.point)
      .addScaledVector(discoBallFacetNormal,.02);

    discoBallSpotQuaternion.setFromUnitVectors(
      discoBallSpotUpAxis,
      discoBallFacetNormal
    );

    // Slightly bigger the farther it's travelled — a rough stand-in for
    // real beam divergence (a reflected beam spreads with distance, the
    // same way any spotlight's own beam does) — but with a decent-sized
    // FLOOR under that scaling: the closest spots, landing right near the
    // ball, are exactly the ones most likely to actually be in frame
    // when someone's looking at it, so those can't be left at some tiny
    // near-invisible minimum just because they're close. Also scaled by
    // this facet's own smooth fade-in brightness (see above) — see the
    // comment at the top of this function for why that's a size fade
    // rather than a true per-instance opacity/colour fade.
    const radius =
      brightness*
      THREE.MathUtils.clamp(
        .25+hit.distance*.025,
        .25,
        1.1
      );

    discoBallSpotScale.set(radius,radius,radius);

    discoBallSpotMatrix.compose(
      discoBallSpotOrigin,
      discoBallSpotQuaternion,
      discoBallSpotScale
    );

    S.discoBallSpots.setMatrixAt(
      i,
      discoBallSpotMatrix
    );

  }

  S.discoBallSpots.instanceMatrix.needsUpdate = true;

}


// ============================================================
// DMX
// ============================================================

function applyDMX(data){

  if(!data)
    return;


  try{

    const a =
      data instanceof Uint8Array
      ? data
      : new Uint8Array(data);


    S.dmx.fill(0);

    // The console now sends the full multi-universe buffer (DMX_TOTAL_CHANNELS
    // long, not a fixed 512) — truncating to the first 512 here silently
    // dropped every fixture on universe 2+ back to all-zero DMX regardless
    // of what address() correctly resolved for it.
    S.dmx.set(
      a.subarray(0,S.dmx.length)
    );

    S.packets++;

    S.dmxDirty = true;

    requestRender();

  }catch(err){

    console.error(
      "DMX error:",
      err
    );

  }

}


// ============================================================
// ART-NET
// ============================================================

// Raw Art-Net packets (relayed over this window's own ws://localhost:8081
// connection — a separate, optional path from the console's postMessage
// DMX_UPDATE sync) carry exactly ONE universe's worth of channels, with
// that universe number in the header (bytes 14-15, low byte first). This
// used to hand that single-universe slice straight to applyDMX(), which
// replaces the ENTIRE multi-universe S.dmx buffer — so every incoming
// packet zeroed every OTHER universe's already-synced data and mislabelled
// whatever universe it actually was as universe 1. Merging into just that
// universe's own segment of S.dmx leaves the rest alone.
function artnet(data){

  if(!(data instanceof ArrayBuffer))
    return;


  const p =
    new Uint8Array(data);


  if(
    p.length < 18 ||
    p[0] !== 65 ||
    p[1] !== 114 ||
    p[2] !== 116 ||
    p[3] !== 45
  )
    return;


  const wireUniverse =
    p[14] | (p[15]<<8);

  const patchUniverse =
    wireUniverse + 1;

  if(
    patchUniverse < 1 ||
    patchUniverse > MAX_UNIVERSES
  )
    return;


  const len =
    Math.min(
      (p[16]<<8)|p[17],
      DMX_CHANNELS
    );

  const start =
    (patchUniverse-1)*DMX_CHANNELS;


  S.dmx.set(
    p.subarray(18,18+len),
    start
  );

  if(len < DMX_CHANNELS)
    S.dmx.fill(
      0,
      start+len,
      start+DMX_CHANNELS
    );


  S.packets++;

  S.dmxDirty = true;

  requestRender();

}


// ============================================================
// REQUEST FIXTURES
// ============================================================

function requestFixtures(){

  if(!window.opener)
    return;


  window.opener.postMessage(
    {type:"REQUEST_FIXTURES"},
    "*"
  );

  window.opener.postMessage(
    {type:"REQUEST_FIXTURE_SYNC"},
    "*"
  );

  window.opener.postMessage(
    {type:"VISUALIZER_READY"},
    "*"
  );

}


// ============================================================
// MESSAGE HANDLING
// ============================================================

window.addEventListener(
  "message",
  e=>{

    const d = e.data;

    if(!d)
      return;


    if(
      d.type === "SYNC_FIXTURES" ||
      d.type === "FIXTURES_SYNC" ||
      d.type === "PATCH_SYNC"
    ){

      const list =
        d.fixtures ||
        d.patchedFixtures ||
        d.patch ||
        d.data?.fixtures ||
        [];


      const previousFixtures =
        Array.isArray(S.fixtures)
          ? S.fixtures
          : [];


      S.fixtures =
        Array.isArray(list)
        ? list
        : Object.values(
            list || {}
          );


      // S.fixturePositions/S.fixtureManualRot are keyed by array index,
      // but the console's fixture array can reorder between one
      // SYNC_FIXTURES and the next with no fixture actually moving —
      // e.g. js/groups.js re-sorts State.fixtures by fixture number on
      // every renderFixtures() call, which MIDI updates, QLab cue
      // playback, and ordinary UI refreshes all trigger constantly.
      // Without re-keying here, makeFixture() would look up the NEW
      // index against the OLD index-keyed map and silently hand a
      // fixture whatever position/rotation used to belong to a
      // DIFFERENT fixture that previously sat at that index — fixtures
      // swapping places/aim with no error. Re-key by stable id (same
      // approach as resolveFixtureIndex, used for save/load) so a
      // reorder can't scramble already-placed fixtures.
      if(
        previousFixtures.length &&
        (S.fixturePositions.size || S.fixtureManualRot.size)
      ){

        const oldIndexToId =
          previousFixtures.map(
            fx => fx?.id != null ? String(fx.id) : null
          );

        const newIdToIndex =
          new Map(
            S.fixtures.map(
              (fx,i) => [String(fx?.id),i]
            )
          );

        const rekeyById = map => {

          const next = new Map();

          map.forEach((value,oldIndex) => {

            const id = oldIndexToId[oldIndex];

            const newIndex =
              id != null
                ? newIdToIndex.get(id)
                : undefined;

            if(newIndex !== undefined)
              next.set(newIndex,value);

          });

          return next;

        };

        S.fixturePositions = rekeyById(S.fixturePositions);
        S.fixtureManualRot = rekeyById(S.fixtureManualRot);

      }


      S.library =
        d.fixtureLibrary ||
        d.library ||
        d.data?.fixtureLibrary ||
        {};


      S.fixtureCache.clear();

      rebuildFixtures();

      // Saved positions are keyed by fixture id (with index as a
      // fallback for older saves) — that resolution can only happen
      // once the REAL fixture list has actually arrived here, not
      // at page load before it exists. Only do this once per page
      // load, the first time fixtures show up, so it behaves like
      // "restore on open" rather than re-snapping fixtures back to
      // their saved spot on every later SYNC_FIXTURES (e.g. after
      // dragging one mid-session).
      if(!S.autoRestoredPositions){

        S.autoRestoredPositions = true;

        loadPositionsFromStorage(true);

      }

    }


    if(d.type === "DMX_UPDATE"){

      applyDMX(
        d.dmx ||
        d.data
      );

    }


    if(d.type === "FIXTURE_PATCHED"){

      requestFixtures();

    }


    // The console caches the last LOADED show's visualizer positions
    // (window.__loadedShowVisualizerState in js/showfile.js) and resends
    // them here as soon as this window announces VISUALIZER_READY —
    // that's the only path that can restore a show's saved positions
    // when the show was loaded WHILE THIS WINDOW WAS CLOSED (opening
    // the visualizer only afterwards otherwise leaves it falling back
    // to whatever's in this browser's own local "vizPositions" cache,
    // which has nothing to do with the show that was actually loaded —
    // reported as "positions scattered everywhere" after LOAD). The
    // console side of this handshake already existed; this was the
    // missing receiver.
    if(d.type === "LOAD_VISUALIZER_STATE"){

      const state = d.state || {};

      applyLoadedPositions(
        Array.isArray(state.fixturePositions)
          ? state.fixturePositions
          : [],
        Array.isArray(state.fixtureManualRot)
          ? state.fixtureManualRot
          : []
      );

      if(S.grid)
        S.grid.visible = state.gridOn !== false;

    }

  }
);


// ============================================================
// MESH HELPER
// ============================================================

// Every caller of mesh() (and makeTrussBar() below) is theatre() building
// a piece of the fixed set — floor, stage, proscenium, curtains, truss —
// never a fixture part. Registering each one into S.beamOccluders here,
// in one place, is what lets the BEAM LENGTH section of updateFixtures
// (see the comment there) treat the whole set consistently as "solid
// things a beam can run into" without every future set piece needing its
// own manual registration line.
function mesh(
  geo,
  mat,
  pos
){

  const m =
    new THREE.Mesh(
      geo,
      mat
    );

  if(pos)
    m.position.set(...pos);

  S.scene.add(m);

  S.beamOccluders?.push(m);

  return m;

}


// ============================================================
// CURTAIN
// ============================================================

function curtain(x){

  const geo =
    new THREE.PlaneGeometry(
      8,
      8,
      8,
      6
    );


  const position =
    geo.attributes.position;


  for(
    let i=0;
    i<position.count;
    i++
  ){

    const px =
      position.getX(i);

    position.setZ(
      i,
      Math.sin(
        (px+4)*Math.PI*2
      )*.2
    );

  }


  position.needsUpdate = true;

  geo.computeVertexNormals();


  const c =
    mesh(

      geo,

      new THREE.MeshStandardMaterial({
        color:0x20c040,
        roughness:.9,
        side:THREE.DoubleSide
      }),

      [x,4,-12]

    );


  c.castShadow = true;
  c.receiveShadow = true;

}

    );

  });

}

// ============================================================
// TRUSS
// ============================================================

function makeTrussBar(
  length=30,
  yPos=9.5,
  zPos=-2,
  color=0x444444
){

  const trussGeo =
    new THREE.CylinderGeometry(
      .25,
      .25,
      length,
      8
    );


  const trussMat =
    new THREE.MeshStandardMaterial({
      color:color,
      metalness:.9,
      roughness:.2
    });


  const truss =
    new THREE.Mesh(
      trussGeo,
      trussMat
    );


  truss.rotation.z =
    Math.PI/2;

  truss.position.set(
    0,
    yPos,
    zPos
  );


  truss.castShadow = true;
  truss.receiveShadow = false;


  S.scene.add(truss);

  S.beamOccluders?.push(truss);

  return truss;

}


// ============================================================
// THEATRE
// ============================================================

function theatre(){

  // Populated by mesh()/makeTrussBar() as each set piece below is
  // created — see the comment on mesh() for why. Initialized here,
  // before any of them run, rather than alongside S.groundMeshes further
  // down, specifically so the very first pieces (floor, stage) don't
  // silently no-op their push through the `S.beamOccluders?.` guard.
  S.beamOccluders = [];

  // ----------------------------------------------------------
  // FLOOR
  // ----------------------------------------------------------

  const floor =
    mesh(

      new THREE.PlaneGeometry(
        50,
        50
      ),

      new THREE.MeshStandardMaterial({
        color:.12,
        roughness:.9
      })

    );


  floor.rotation.x =
    -Math.PI/2;

  floor.receiveShadow = true;


  // ----------------------------------------------------------
  // STAGE
  // ----------------------------------------------------------

  const stage =
    mesh(

      new THREE.BoxGeometry(
        22,
        1.3,
        22
      ),

      new THREE.MeshStandardMaterial({
        color:.09,
        roughness:.8
      }),

      [0,.65,-9]

    );


  stage.receiveShadow = true;


  // Surfaces a beam's floor-landing decal (see FLOOR SPOT in
  // updateFixtures) can actually land on. The stage sits ABOVE the
  // base floor (top at y=.65+1.3/2=1.3 vs the floor's y=0) — a flat
  // y=0 plane intersection landed every beam aimed at the stage
  // footprint physically inside/under the stage box, invisible from
  // any camera angle. Raycasting against the real geometry instead
  // means the decal always lands on whichever surface is actually
  // there.
  S.groundMeshes = [floor, stage];


  // ----------------------------------------------------------
  // FRONT STRUCTURE
  // ----------------------------------------------------------

  const black =
    new THREE.MeshStandardMaterial({
      color:.025,
      roughness:.9
    });


  mesh(
    new THREE.BoxGeometry(
      23,
      .6,
      .6
    ),
    black,
    [0,8.5,-12]
  );


  mesh(
    new THREE.BoxGeometry(
      .6,
      8.5,
      .6
    ),
    black,
    [-11,4.5,-12]
  );


  mesh(
    new THREE.BoxGeometry(
      .6,
      8.5,
      .6
    ),
    black,
    [11,4.5,-12]
  );


  // ----------------------------------------------------------
  // CURTAINS
  // ----------------------------------------------------------

  curtain(-7.5);
  curtain(7.5);


  // ----------------------------------------------------------
  // TRUSS
  // ----------------------------------------------------------

  makeTrussBar(
    30,
    9.5,
    -2,
    0x555555
  );

  makeTrussBar(
    30,
    9.5,
    -5,
    0x555555
  );

  makeTrussBar(
    30,
    9.5,
    -8,
    0x444444
  );

  makeTrussBar(
    32,
    8.5,
    10,
    0x555555
  );


  // ----------------------------------------------------------
  // SEATS
  // ----------------------------------------------------------

  const seatMat =
    new THREE.MeshStandardMaterial({
      color:.07,
      roughness:.9
    });


  const riserMat =
    new THREE.MeshStandardMaterial({
      color:.11,
      roughness:.9
    });


  const rows = 7;
  const seatsPerRow = 15;

  const rowDepth = 1.6;
  const risePerRow = .55;


  // ----------------------------------------------------------
  // RISERS
  // ----------------------------------------------------------

  for(
    let r=0;
    r<rows;
    r++
  ){

    const rowBaseY =
      r*risePerRow;


    const rowZ =
      6+r*rowDepth;


    mesh(

      new THREE.BoxGeometry(
        20,
        risePerRow,
        rowDepth
      ),

      riserMat,

      [
        0,
        rowBaseY+risePerRow/2,
        rowZ
      ]

    );

  }


  // ----------------------------------------------------------
  // SEAT INSTANCING
  // ----------------------------------------------------------

  const seatGeometry =
    new THREE.BoxGeometry(
      1,
      .35,
      .9
    );


  const backGeometry =
    new THREE.BoxGeometry(
      1,
      .9,
      .2
    );


  const totalSeats =
    rows * seatsPerRow;


  const seats =
    new THREE.InstancedMesh(
      seatGeometry,
      seatMat,
      totalSeats
    );


  const backs =
    new THREE.InstancedMesh(
      backGeometry,
      seatMat,
      totalSeats
    );


  seats.castShadow = true;
  seats.receiveShadow = true;

  backs.castShadow = true;
  backs.receiveShadow = true;


  const dummy =
    new THREE.Object3D();


  let instance = 0;


  for(
    let r=0;
    r<rows;
    r++
  ){

    const rowBaseY =
      r*risePerRow;

    const rowTopY =
      rowBaseY+.3;

    const rowZ =
      6+r*rowDepth;


    for(
      let s=0;
      s<seatsPerRow;
      s++
    ){

      const seatX =
        (s-(seatsPerRow-1)/2)*1.2;


      dummy.position.set(
        seatX,
        rowTopY,
        rowZ
      );

      dummy.rotation.set(
        0,
        0,
        0
      );

      dummy.scale.set(
        1,
        1,
        1
      );

      dummy.updateMatrix();

      seats.setMatrixAt(
        instance,
        dummy.matrix
      );


      dummy.position.set(
        seatX,
        rowTopY+.3,
        rowZ+.45
      );

      dummy.updateMatrix();

      backs.setMatrixAt(
        instance,
        dummy.matrix
      );


      instance++;

    }

  }


  seats.instanceMatrix.needsUpdate = true;
  backs.instanceMatrix.needsUpdate = true;


  S.scene.add(seats);
  S.scene.add(backs);


  // ----------------------------------------------------------
  // DISCO BALL — a genuinely round, curved, shadow-casting object to
  // test beams/shadows against, unlike everything else in the set
  // (floor, curtains, truss, proscenium), which is flat or cylindrical
  // along one axis. A beam sweeping across it should show its landing
  // highlight curve smoothly across the surface, and an occluder placed
  // between a fixture and the ball should cast a haze shadow that
  // correctly follows the ball's own curvature — both good checks that
  // the beam-length/haze-shadow work earlier holds up against a real,
  // non-planar target, not just boxes and curtains.
  //
  // A plain smooth SphereGeometry — see makeDiscoBallTileTexture's own
  // comment for why the visible tile grid comes from a texture (map +
  // bumpMap) instead of genuine faceted geometry now. envMapIntensity is
  // deliberately much lower than other metal fixture parts elsewhere in
  // this file (.5 there vs a much higher value tried here initially) —
  // this ball sits far closer to its own light sources than any fixture
  // body does, and RoomEnvironment's brightest baked-in panels blew out
  // to a solid white sphere under bloom before this was turned down.
  // ----------------------------------------------------------

  const discoBallTileTexture =
    makeDiscoBallTileTexture();

  const discoBall =
    mesh(

      new THREE.SphereGeometry(1, 48, 32),

      new THREE.MeshStandardMaterial({
        color:0xffffff,
        metalness:.9,
        roughness:.35,
        envMap:S.envMap,
        envMapIntensity:.6,
        map:discoBallTileTexture,
        bumpMap:discoBallTileTexture,
        bumpScale:.015
      }),

      [0,7,-2]

    );

  discoBall.castShadow = true;
  discoBall.receiveShadow = true;

  S.discoBall = discoBall;

  // Thin hanging chain up to the truss it's rigged from (see
  // makeTrussBar(30,9.5,-2,...) above) — purely cosmetic, so built
  // directly rather than through mesh() specifically to KEEP IT OUT of
  // S.beamOccluders. It first looked like a .03-radius wire could never
  // plausibly block a beam, but it sits directly above the ball, exactly
  // on the line from the truss down to it — precisely where anyone would
  // naturally mount a fixture to light the ball from above. A fixture
  // aimed straight down the ball's own hanging line hit this chain
  // first, at a real but tiny distance, collapsing the whole haze cone
  // down to a barely-visible stub and reading as "no beam at all."
  const discoBallChain =
    new THREE.Mesh(

      new THREE.CylinderGeometry(.03,.03,1.5,6),

      new THREE.MeshStandardMaterial({
        color:0x222222,
        metalness:.8,
        roughness:.4
      })

    );

  discoBallChain.position.set(0,8.25,-2);

  S.scene.add(discoBallChain);


  // ----------------------------------------------------------
  // DISCO BALL SPOTS — the actual signature "disco ball" effect: a real
  // one doesn't just sit there, it shatters a nearby light into dozens of
  // separate reflections that land as small, independent moving spots on
  // the walls/floor/ceiling around it. An earlier version of this tried
  // to show that as visible RAYS running from the ball out to each
  // landing point, which looked wrong for a simple, unavoidable reason:
  // any thin line whose start point sits on a small sphere reads as
  // "spikes stuck to that sphere" once rendered, no matter how its
  // direction is actually computed. Landing spots alone — no visible
  // line connecting them back to the ball, exactly like the real thing
  // when there isn't enough haze in the air to see the beam itself —
  // sidestep that entirely.
  //
  // Each of DISCO_BALL_SPOT_COUNT candidate facets (see
  // fibonacciSphereDirections) only shows a spot when its current
  // (rotating) normal actually faces DISCO_BALL_KEY_LIGHT_DIRECTION —
  // real tiles only sparkle where light actually reaches them — and the
  // direction it reflects that light in follows the real law of
  // reflection off that normal, not the facet's own outward direction
  // (which is what made the earlier ray version visibly track the ball's
  // rotation instead of sweeping independently the way a real mirror
  // ball's glints do). See updateDiscoBallSpots, called from animate()
  // right after the ball's own rotation is updated each frame.
  // ----------------------------------------------------------

  const discoBallSpotDirections =
    fibonacciSphereDirections(DISCO_BALL_SPOT_COUNT);

  const discoBallSpots =
    new THREE.InstancedMesh(
      S.floorSpotGeometry,
      new THREE.MeshBasicMaterial({
        map:S.floorSpotTexture,
        color:0xffffff,
        transparent:true,
        opacity:.85,
        depthWrite:false,
        blending:THREE.AdditiveBlending,
        side:THREE.DoubleSide
      }),
      DISCO_BALL_SPOT_COUNT
    );

  // Real instance transforms are computed fresh every frame in
  // updateDiscoBallSpots (which facets are lit, and where their
  // reflection lands, both change continuously) — this starting
  // frustumCulled=false just stops three.js culling the whole
  // InstancedMesh against a stale/default bounding sphere before that
  // first update ever runs.
  discoBallSpots.frustumCulled = false;

  S.scene.add(discoBallSpots);

  S.discoBallSpots = discoBallSpots;
  S.discoBallSpotDirections = discoBallSpotDirections;


  // ----------------------------------------------------------
  // LIGHTS
  // ----------------------------------------------------------

  createHouse();
  createWork();

}


// ============================================================
// MOUSE
// ============================================================

const raycaster =
  new THREE.Raycaster();

const mouse =
  new THREE.Vector2();


function getMouseNDCoords(e){

  const rect =
    $("viz").getBoundingClientRect();


  mouse.x =
    ((e.clientX-rect.left)/
      rect.width)*2-1;


  mouse.y =
    -((e.clientY-rect.top)/
      rect.height)*2+1;

}


// ============================================================
// MOUSE DOWN
// ============================================================

window.addEventListener(
  "mousedown",
  e=>{

    getMouseNDCoords(e);


    raycaster.setFromCamera(
      mouse,
      S.camera
    );


    const aimHits =
      raycaster.intersectObjects(
        S.aimHeads,
        false
      );


    if(aimHits.length > 0){

      e.preventDefault();


      const obj =
        aimHits[0].object;


      const fixtureObj =
        S.objects.find(
          o => o.head === obj
        );


      if(fixtureObj)
        fixtureObj.manualAim = true;


      S.selectedAim =
        fixtureObj;

      S.selectedFixture = null;

      S.controls.enabled = false;

      requestRender();

      return;

    }


    const bodyHits =
      raycaster.intersectObjects(
        S.fixtureBodies,
        false
      );


    if(bodyHits.length > 0){

      e.preventDefault();


      const hit =
        bodyHits[0];


      S.selectedFixture =
        hit.object.userData.mountRef;

      S.selectedAim = null;


      S.dragPlane.normal
        .copy(
          S.camera.position
        )
        .normalize();


      raycaster.ray.intersectPlane(
        S.dragPlane,
        S.dragOffset
      );


      S.dragOffset.sub(
        S.selectedFixture.position
      );


      // Only change the selected material instance.
      // Fixture body materials are shared.
      //
      // Therefore we intentionally don't modify the shared
      // material here. Instead use object-level highlight.
      //
      // Keep behaviour visually close using a temporary
      // material clone only for the selected object.

      if(
        !hit.object.userData.originalMaterial
      ){

        hit.object.userData.originalMaterial =
          hit.object.material;

      }


      if(
        hit.object.material ===
        hit.object.userData.originalMaterial
      ){

        hit.object.material =
          hit.object.userData.originalMaterial.clone();

      }


      hit.object.material.emissive.set(
        0x444444
      );

      hit.object.material
        .emissiveIntensity = 1;


      S.controls.enabled = false;

      requestRender();

    }else{

      S.selectedFixture = null;
      S.selectedAim = null;


      for(
        let i=0;
        i<S.fixtureBodies.length;
        i++
      ){

        const b =
          S.fixtureBodies[i];

        if(
          b.userData.originalMaterial &&
          b.material !==
            b.userData.originalMaterial
        ){

          b.material.dispose();

          b.material =
            b.userData.originalMaterial;

        }

      }


      requestRender();

    }

  }
);


// ============================================================
// MOUSE MOVE
// ============================================================

window.addEventListener(
  "mousemove",
  e=>{

    if(S.selectedFixture){

      getMouseNDCoords(e);


      raycaster.setFromCamera(
        mouse,
        S.camera
      );


      raycaster.ray.intersectPlane(
        S.dragPlane,
        mouseIntersect
      );


      mouseIntersect.sub(
        S.dragOffset
      );


      S.selectedFixture.position.copy(
        mouseIntersect
      );


      requestRender();

    }


    if(S.selectedAim){

      getMouseNDCoords(e);


      raycaster.setFromCamera(
        mouse,
        S.camera
      );


      raycaster.ray.intersectPlane(
        mousePlane,
        mouseTarget
      );


      const mountPos =
        S.selectedAim.group.position;


      mouseDirection
        .subVectors(
          mouseTarget,
          mountPos
        )
        .normalize();


      const newPan =
        Math.atan2(
          mouseDirection.x,
          mouseDirection.z
        );


      const newTilt =
        -Math.asin(
          THREE.MathUtils.clamp(
            mouseDirection.y,
            -1,
            1
          )
        );


      S.selectedAim.panGroup
        .rotation.y = newPan;


      S.selectedAim.tiltGroup
        .rotation.x = newTilt;


      const idx =
        S.objects.indexOf(
          S.selectedAim
        );


      S.fixtureManualRot.set(
        idx,
        {
          pan:newPan,
          tilt:newTilt
        }
      );


      requestRender();

    }

  }
);


// ============================================================
// MOUSE UP
// ============================================================

window.addEventListener(
  "mouseup",
  ()=>{

    if(S.selectedFixture){

      const idx =
        S.objects.findIndex(
          o =>
            o.group ===
            S.selectedFixture
        );


      if(idx !== -1){

        S.fixturePositions.set(
          idx,
          S.selectedFixture.position.clone()
        );

      }

    }


    S.selectedFixture = null;
    S.selectedAim = null;


    if(S.controls)
      S.controls.enabled = true;


    requestRender();

  }
);


// ============================================================
// SAVE
// ============================================================

function savePositionsToStorage(){

  const posArr = [];


  S.fixturePositions.forEach(
    (v,i)=>{

      posArr.push({

        index:i,
        id:S.fixtures[i]?.id ?? null,

        x:v.x,
        y:v.y,
        z:v.z

      });

    }
  );


  const rotArr = [];


  S.fixtureManualRot.forEach(
    (r,i)=>{

      rotArr.push({

        index:i,
        id:S.fixtures[i]?.id ?? null,

        pan:r.pan,
        tilt:r.tilt

      });

    }
  );


  localStorage.setItem(
    "vizPositions",
    JSON.stringify({
      pos:posArr,
      rot:rotArr
    })
  );


  statusText(
    "✅ SAVED to browser storage"
  );

}


// ============================================================
// LOAD
// ============================================================

function loadPositionsFromStorage(silent=false){

  const saved =
    localStorage.getItem(
      "vizPositions"
    );


  if(!saved){

    if(!silent) statusText(
      "⚠️ No saved positions"
    );

    return;

  }


  try{

    const data =
      JSON.parse(saved);


    const posList =
      (data.pos||[]).map(
        p=>({

          fixtureIndex:p.index,
          fixtureId:p.id ?? null,

          x:p.x,
          y:p.y,
          z:p.z

        })
      );


    const rotList =
      (data.rot||[]).map(
        r=>({

          fixtureIndex:r.index,
          fixtureId:r.id ?? null,

          pan:r.pan,
          tilt:r.tilt

        })
      );


    applyLoadedPositions(
      posList,
      rotList
    );


    if(!silent) statusText(
      "✅ RESTORED from storage"
    );


  }catch(e){

    console.error(
      "Load failed:",
      e
    );


    if(!silent) statusText(
      "❌ Load failed"
    );

  }

}
