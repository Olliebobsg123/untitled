name: LXRemote
options:
  bundleIdPrefix: com.olivergrainger
  deploymentTarget:
    iOS: "16.0"
targets:
  LXRemote:
    type: application
    platform: iOS
    sources: [LXRemote]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.olivergrainger.lxremote
        MARKETING_VERSION: "3.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: LXRemote/Info.plist
      properties:
        CFBundleDisplayName: LX Remote
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocalNetworkUsageDescription: LX Remote finds and controls Light Spark on your Wi-Fi.
        NSBonjourServices: ["_lxconsole._tcp"]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
schemes:
  LXRemote:
    build:
      targets:
        LXRemote: all
    run:
      config: Debug
